    countLabel.textContent = `${filtered.length} of ${state.admin.banks.length} banks`;
    if(filtered.length === 0){
      tbody.appendChild(el(`<tr><td colspan="7" class="py-6 text-center text-[13px]" style="color:var(--text-400)">No banks match this search/filter.</td></tr>`));
      return;
    }
    filtered.forEach(b=>{
      const sectorBadge = (b.allowedSectors && b.allowedSectors.length < 4)
        ? b.allowedSectors.map(s=>sectorLabelsShort[s]||s).join(' / ')
        : 'All sectors';
      const productCount = (b.products && b.products.length) ? b.products.length : 1;
      const row = el(`
        <tr class="border-b" style="border-color:var(--line)">
          <td class="py-2.5 px-3">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${b.color}"></span>
              <span class="font-semibold">${b.name}</span>
              <span class="badge ${b.type==='finance'?'badge-amber':'badge-teal'}">${b.type==='finance'?'Finance':'Bank'}</span>
              ${!b.active ? '<span class="badge badge-grey">Inactive</span>' : ''}
            </div>
          </td>
          <td class="py-2.5 px-3 font-mono">${Number(b.baseRate).toFixed(2)}%</td>
          <td class="py-2.5 px-3"><span class="badge ${productCount > 1 ? 'badge-gold' : 'badge-grey'}">${productCount} product${productCount===1?'':'s'}</span></td>
          <td class="py-2.5 px-3">
            <div class="flex flex-wrap gap-1">
              <span class="badge badge-teal">${sectorBadge}</span>
            </div>
          </td>
          <td class="py-2.5 px-3 text-center"><div class="toggle active-toggle inline-flex ${b.active?'on':''}" data-activeid="${b.id}"><div class="dot"></div></div></td>
          <td class="py-2.5 px-3 text-center"><div class="toggle spons-toggle inline-flex ${b.sponsored?'on':''}" data-sponsorid="${b.id}"><div class="dot"></div></div></td>
          <td class="py-2.5 px-3"><button type="button" class="edit-bank-btn btn-ghost px-3 py-1.5 rounded-lg text-[12px] whitespace-nowrap"><i class="fa-solid fa-pen mr-1"></i>Edit Bank</button></td>
        </tr>
      `);
      row.querySelector('.active-toggle').addEventListener('click', e=>{ b.active = !b.active; e.currentTarget.classList.toggle('on'); row.querySelector('td .badge-grey')?.remove(); if(!b.active){ row.querySelector('td span.font-semibold').insertAdjacentHTML('afterend', ' <span class="badge badge-grey">Inactive</span>'); } persistBanksToStorage(); });
      row.querySelector('.spons-toggle').addEventListener('click', e=>{ b.sponsored = !b.sponsored; e.currentTarget.classList.toggle('on'); persistBanksToStorage(); });
      row.querySelector('.edit-bank-btn').addEventListener('click', ()=>openBankDrawer(b));
      tbody.appendChild(row);
    });
  }
  buildRows();

  card.querySelector('#bankSearchInput').addEventListener('input', e=>{
    state.adminBankSearch = e.target.value;
    buildRows();
  });
  card.querySelector('#bankTypeFilter').addEventListener('change', e=>{
    state.adminBankFilter = e.target.value;
    buildRows();
  });

  card.querySelector('#addBankBtn').addEventListener('click', ()=>openBankDrawer(null));
  return card;
}

/* Slide-over drawer for adding/editing a single bank's full parameter set — keeps the
   main Banks tab list completely clutter-free while still exposing every field. */
function openBankDrawer(existing){
  const isNew = !existing;
  const b = existing || { id:'', name:'', short:'', type:'bank', active:true, sponsored:false, baseRate:12, maxTermYears:{personal:5, professional:6, housing:20, vehicle:6, business:5, pension:3}, docChargePct:0.75, docChargeMin:2000, docChargeCap:25000, color:'#00695C', updatedDate: new Date().toLocaleDateString('en-LK', { day:'2-digit', month:'short', year:'numeric' }), allowedSectors:['government','semi_government','private','self_employed'], targetOccupation:'all', remarks:[], specialSchemeRemarks:[], specialRate:null, specialDocChargePct:null, specialMaxTermYears:null };

  const backdrop = el(`<div class="fixed inset-0 z-50 drawer-backdrop"></div>`);
  const panel = el(`
    <div class="drawer-panel">
      <div class="p-5 sm:p-6 border-b flex items-start justify-between gap-3" style="border-color:var(--line)">
        <div>
          <p class="font-display font-bold text-lg" style="color:var(--teal-900)">${isNew?'Add a new bank / loan product':'Edit '+b.name}</p>
          <p class="text-[12.5px] mt-0.5" style="color:var(--text-600)">Base Bank Parameters and whole-bank eligibility criteria. Individual loan products are managed in the Loan Products tab.</p>
        </div>
        <button id="closeDrawer" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 flex-shrink-0"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-5 sm:p-6">
        <div class="grid sm:grid-cols-4 gap-3">
          <div><label class="field-label">Bank / lender name</label><input type="text" id="bfName" value="${b.name}"></div>
          <div><label class="field-label">Short label</label><input type="text" id="bfShort" value="${b.short}"></div>
          <div><label class="field-label">Type</label><select id="bfType"><option value="bank" ${b.type==='bank'?'selected':''}>Bank</option><option value="finance" ${b.type==='finance'?'selected':''}>Finance Company</option></select></div>
          <div><label class="field-label">Rates effective date</label><input type="text" id="bfDate" value="${b.updatedDate}" placeholder="e.g. Aug 07, 2026"></div>
        </div>

        <p class="text-[11px] font-bold tracking-wide mt-3" style="color:var(--teal-700)"><i class="fa-solid fa-building-columns mr-1"></i>BASE BANK PARAMETERS</p>
        <div class="p-2.5 rounded-xl mt-2" style="background:var(--teal-50)">
          <div class="grid sm:grid-cols-4 gap-3">
            <div><label class="field-label">Base rate (%)</label><input type="number" step="0.05" id="bfRate" value="${b.baseRate}"></div>
            <div><label class="field-label">Doc charge (%)</label><input type="number" step="0.05" id="bfDocPct" value="${b.docChargePct}"></div>
            <div><label class="field-label">Doc charge min (LKR)</label><input type="number" id="bfDocMin" value="${b.docChargeMin}"></div>
            <div><label class="field-label">Doc charge cap (LKR)</label><input type="number" id="bfDocCap" value="${b.docChargeCap}"></div>
          </div>
          <p class="field-label mt-3">Max term by loan category (years — 0 = not offered)</p>
          <div class="grid grid-cols-3 sm:grid-cols-6 gap-3">
            ${Object.keys(LOAN_LABELS).map(cat=>`<div><label class="hint !mt-0 !mb-1">${LOAN_LABELS[cat]}</label><input type="number" min="0" max="30" id="bfTerm_${cat}" value="${b.maxTermYears[cat]||0}"></div>`).join('')}
          </div>
          <div class="mt-3">
            <label class="field-label">Remarks / guarantor conditions for this bank's core facility (one per line)</label>
            <textarea id="bfRemarks" rows="2" class="w-full text-[13px]" style="border:1.5px solid var(--line); border-radius:10px; padding:7px 10px;">${(b.remarks||[]).join('\n')}</textarea>
          </div>
        </div>

        <p class="field-label mt-3">Sector eligibility &amp; status</p>
        <div class="p-2.5 rounded-xl" style="background:var(--teal-50)">
          <p class="text-[12px] font-semibold mb-2" style="color:var(--text-600)">Allowed employment sectors</p>
          <div class="flex items-center gap-4 flex-wrap">
            <label class="flex items-center gap-2 text-[12.5px] font-semibold" style="color:var(--text-600)"><input type="checkbox" id="bfSectorGov" ${(!b.allowedSectors || b.allowedSectors.includes('government'))?'checked':''}> Government</label>
            <label class="flex items-center gap-2 text-[12.5px] font-semibold" style="color:var(--text-600)"><input type="checkbox" id="bfSectorSemiGov" ${(!b.allowedSectors || b.allowedSectors.includes('semi_government'))?'checked':''}> Semi-Government</label>
            <label class="flex items-center gap-2 text-[12.5px] font-semibold" style="color:var(--text-600)"><input type="checkbox" id="bfSectorPrivate" ${(!b.allowedSectors || b.allowedSectors.includes('private'))?'checked':''}> Private</label>
            <label class="flex items-center gap-2 text-[12.5px] font-semibold" style="color:var(--text-600)"><input type="checkbox" id="bfSectorSelf" ${(!b.allowedSectors || b.allowedSectors.includes('self_employed'))?'checked':''}> Self-Employed</label>
          </div>
          <p id="bfSectorError" class="hint hidden" style="color:var(--danger)">At least one sector must be allowed.</p>
          <p class="hint">Sector restrictions apply to this bank's entire product range. Occupation and other per-product eligibility is set in the Loan Products tab.</p>
        </div>

        <div class="flex items-center gap-4 mt-3">
          <label class="flex items-center gap-2 text-[12.5px] font-semibold" style="color:var(--text-600)"><input type="checkbox" id="bfActive" ${b.active?'checked':''}> Active</label>
          <label class="flex items-center gap-2 text-[12.5px] font-semibold" style="color:var(--text-600)"><input type="checkbox" id="bfSponsored" ${b.sponsored?'checked':''}> Sponsored</label>
        </div>
      </div>
      <div class="p-5 sm:p-6 border-t flex gap-2 sticky bottom-0" style="border-color:var(--line); background:var(--card)">
        <button id="bfSave" type="button" class="btn-primary px-4 py-2 rounded-xl text-[13px]">${isNew?'Add bank':'Save changes'}</button>
        <button id="bfCancel" type="button" class="btn-ghost px-4 py-2 rounded-xl text-[13px]">Cancel</button>
      </div>
    </div>
  `);
  backdrop.appendChild(panel);
  document.body.appendChild(backdrop);
  document.body.style.overflow = 'hidden';

  function close(){ backdrop.remove(); document.body.style.overflow=''; }
  panel.querySelector('#closeDrawer').addEventListener('click', close);
  panel.querySelector('#bfCancel').addEventListener('click', close);
  backdrop.addEventListener('click', (e)=>{ if(e.target===backdrop) close(); });

  panel.querySelector('#bfSave').addEventListener('click', ()=>{
    const name = panel.querySelector('#bfName').value.trim();
    if(!name) return;
    const allowedSectors = [];
    if(panel.querySelector('#bfSectorGov').checked) allowedSectors.push('government');
    if(panel.querySelector('#bfSectorSemiGov').checked) allowedSectors.push('semi_government');
    if(panel.querySelector('#bfSectorPrivate').checked) allowedSectors.push('private');
    if(panel.querySelector('#bfSectorSelf').checked) allowedSectors.push('self_employed');
    panel.querySelector('#bfSectorError').classList.toggle('hidden', allowedSectors.length > 0);
    if(allowedSectors.length === 0) return;
    const updated = {
      id: b.id || 'bank_'+Date.now(),
      name,
      short: panel.querySelector('#bfShort').value.trim() || name.slice(0,8),
      type: panel.querySelector('#bfType').value,
      active: panel.querySelector('#bfActive').checked,
      sponsored: panel.querySelector('#bfSponsored').checked,
      baseRate: Number(panel.querySelector('#bfRate').value||0),
      docChargePct: Number(panel.querySelector('#bfDocPct').value||0),
      docChargeMin: Number(panel.querySelector('#bfDocMin').value||0),
      docChargeCap: Number(panel.querySelector('#bfDocCap').value||0),
      updatedDate: panel.querySelector('#bfDate').value.trim() || b.updatedDate,
      maxTermYears: Object.fromEntries(Object.keys(LOAN_LABELS).map(cat=>[cat, Number(panel.querySelector('#bfTerm_'+cat).value||0)])),
      allowedSectors,
      // No editor for this in the drawer anymore — occupation targeting is set per
      // product now. Preserved as-is since un-migrated banks' legacy fallback in
      // getBankProducts() still reads it as a whole-bank restriction.
      targetOccupation: b.targetOccupation || 'all',
      color: b.color || '#00695C',
      remarks: panel.querySelector('#bfRemarks').value.split('\n').map(s=>s.trim()).filter(Boolean),
      // These legacy fields no longer have an editor in this drawer (products handle
      // scheme-specific rates directly now), but they're preserved as-is from the
      // existing bank record since un-migrated banks still rely on them as a fallback
      // in getBankProducts() — carrying them over here avoids silently wiping that data.
      specialSchemeRemarks: b.specialSchemeRemarks || [],
      specialRate: b.specialRate ?? null,
      specialDocChargePct: b.specialDocChargePct ?? null,
      specialMaxTermYears: b.specialMaxTermYears ?? null,
      // Products are no longer editable from this drawer at all — preserved as-is from
      // the existing bank record. The Loan Products tab is now the single place that
      // adds, edits, or removes individual products.
      products: b.products || [],
    };
    if(isNew){ state.admin.banks.push(updated); }
    else { Object.assign(b, updated); }
    logAudit(isNew ? 'Added bank' : 'Edited bank', `${updated.name} — ${updated.products.length} specialty product${updated.products.length===1?'':'s'}, base rate ${updated.baseRate}%`);
    persistBanksToStorage();
    close();
    render();
  });
}

/* ---------- Standalone single-product editor ----------

   from the Loan Products tab, scoped to exactly one product on one bank. Replaces the

  const isNew = !existingProduct;

    companiesListRequired:false, companiesListId:null,
    earlySettlementAllowed:true, earlySettlementChargePct:0,
    balloonAllowed:'na', balloonPct:0,
    guarantorRequired:'no', collateralRequired:'none', insuranceRequired:'none',
    latePaymentPenaltyPct:0, gracePeriodDays:0, processingDays:3,
    cribCheckRequired:true, salaryCreditRequired:false, coApplicantAllowed:true, topUpAfterMonths:null,
    currency:'LKR', dtiOverride:null, remarks:[],

  const p = Object.assign({}, PRODUCT_DEFAULTS, JSON.parse(JSON.stringify(existingProduct || {})));
  if(isNew) p.id = 'prod_'+Date.now();

        <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 mb-3">
          <div><label class="hint !mt-0 !mb-1">Category</label><select id="pdCategory">${Object.keys(LOAN_LABELS).filter(k=>k!=='professional').map(k=>`<option value="${k}" ${p.category===k?'selected':''}>${LOAN_LABELS[k]}</option>`).join('')}</select></div>
          <div><label class="hint !mt-0 !mb-1">Interest rate (%)</label><input type="number" step="0.05" id="pdRate" value="${p.rate ?? ''}"></div>

            <div><label class="hint !mt-0 !mb-1">Collateral required</label><select id="pdCollateral"><option value="none" ${p.collateralRequired==='none'?'selected':''}>None</option><option value="vehicle" ${p.collateralRequired==='vehicle'?'selected':''}>Vehicle</option><option value="property" ${p.collateralRequired==='property'?'selected':''}>Property</option><option value="fd" ${p.collateralRequired==='fd'?'selected':''}>Fixed Deposit</option></select></div>
            <div><label class="hint !mt-0 !mb-1">Insurance required</label><select id="pdInsurance"><option value="none" ${p.insuranceRequired==='none'?'selected':''}>None</option><option value="life" ${p.insuranceRequired==='life'?'selected':''}>Life</option><option value="asset" ${p.insuranceRequired==='asset'?'selected':''}>Asset</option><option value="both" ${p.insuranceRequired==='both'?'selected':''}>Both</option></select></div>
            <div><label class="hint !mt-0 !mb-1">CRIB check required?</label><select id="pdCrib"><option value="yes" ${p.cribCheckRequired!==false?'selected':''}>Yes</option><option value="no" ${p.cribCheckRequired===false?'selected':''}>No</option></select></div>
          </div>

          <p class="text-[10.5px] font-bold tracking-wide mb-1.5" style="color:var(--teal-700)">SERVICING TERMS</p>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
            <div><label class="hint !mt-0 !mb-1">Early settlement allowed?</label><select id="pdEarlySettle"><option value="yes" ${p.earlySettlementAllowed!==false?'selected':''}>Yes</option><option value="no" ${p.earlySettlementAllowed===false?'selected':''}>No</option></select></div>
            <div><label class="hint !mt-0 !mb-1">Early settlement charge (%)</label><input type="number" id="pdEarlySettlePct" value="${p.earlySettlementChargePct ?? 0}"></div>
            <div><label class="hint !mt-0 !mb-1">Late payment penalty (%)</label><input type="number" id="pdLatePenalty" value="${p.latePaymentPenaltyPct ?? 0}"></div>
            <div><label class="hint !mt-0 !mb-1">Grace period (days)</label><input type="number" id="pdGrace" value="${p.gracePeriodDays ?? 0}"></div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <div><label class="hint !mt-0 !mb-1">Processing time (business days)</label><input type="number" id="pdProcessing" value="${p.processingDays ?? 3}"></div>
            <div><label class="hint !mt-0 !mb-1">Salary must credit to this bank?</label><select id="pdSalaryCredit"><option value="no" ${!p.salaryCreditRequired?'selected':''}>No</option><option value="yes" ${p.salaryCreditRequired?'selected':''}>Yes</option></select></div>
            <div><label class="hint !mt-0 !mb-1">Co-applicant allowed?</label><select id="pdCoApplicant"><option value="yes" ${p.coApplicantAllowed!==false?'selected':''}>Yes</option><option value="no" ${p.coApplicantAllowed===false?'selected':''}>No</option></select></div>
            <div><label class="hint !mt-0 !mb-1">Top-up allowed after (months)</label><input type="number" id="pdTopup" value="${p.topUpAfterMonths ?? ''}" placeholder="N/A"></div>
          </div>

          <div class="mt-2">
            <label class="hint !mt-0 !mb-1">Remarks / guarantor conditions (one per line)</label>
            <textarea id="pdRemarks" rows="2" class="w-full text-[13px]" style="border:1.5px solid var(--line); border-radius:10px; padding:7px 10px;">${(p.remarks||[]).join('\n')}</textarea>
          </div>
        </div>
      </div>
      <div class="p-5 sm:p-6 border-t flex items-center gap-2 sticky bottom-0" style="border-color:var(--line); background:var(--card)">
        <button id="pdSave" type="button" class="btn-primary px-4 py-2 rounded-xl text-[13px]">${isNew?'Add product':'Save changes'}</button>
        <button id="pdCancel" type="button" class="btn-ghost px-4 py-2 rounded-xl text-[13px]">Cancel</button>
        ${!isNew ? `<button id="pdDelete" type="button" class="ml-auto text-[13px] font-semibold" style="color:var(--danger)"><i class="fa-solid fa-trash mr-1.5"></i>Delete product</button>` : ''}
      </div>
    `;

    panel.querySelector('#pdClose').addEventListener('click', close);
    panel.querySelector('#pdCancel').addEventListener('click', close);
    panel.querySelector('#pdAdvToggle').addEventListener('click', ()=>{ advOpen = !advOpen; renderForm(); });
    panel.querySelector('#pdCategory').addEventListener('change', e=>{ p.category = e.target.value; renderForm(); }); // re-render toggles Leasing Terms
    panel.querySelector('#pdCompReq').addEventListener('change', e=>{ p.companiesListRequired = e.target.value==='yes'; renderForm(); });

    panel.querySelector('#pdName').addEventListener('input', e=>p.name = e.target.value);
    panel.querySelector('#pdRate').addEventListener('input', e=>p.rate = Number(e.target.value||0));
    panel.querySelector('#pdRateType').addEventListener('change', e=>p.interestRateType = e.target.value);
    panel.querySelector('#pdOcc').addEventListener('change', e=>p.targetOccupation = e.target.value);
    panel.querySelector('#pdAmtMax').addEventListener('input', e=>p.loanAmountMax = e.target.value===''?null:Number(e.target.value));
    panel.querySelector('#pdStatus').addEventListener('change', e=>p.status = e.target.value);
    panel.querySelector('#pdGender').addEventListener('change', e=>p.targetGender = e.target.value);
    panel.querySelector('#pdCurrency').addEventListener('change', e=>p.currency = e.target.value);
    panel.querySelector('#pdCommon').addEventListener('change', e=>p.commonLoan = e.target.checked);
    panel.querySelector('#pdDti').addEventListener('input', e=>p.dtiOverride = e.target.value===''?null:Number(e.target.value));
    panel.querySelector('#pdOt').addEventListener('change', e=>p.otIncluded = e.target.value==='yes');
    panel.querySelector('#pdOtherInc').addEventListener('input', e=>p.otherIncomePct = Number(e.target.value||0));
    panel.querySelector('#pdMinIncome').addEventListener('input', e=>p.minNetMonthlyIncome = Number(e.target.value||0));
    panel.querySelector('#pdAgeMin').addEventListener('input', e=>p.ageMin = e.target.value===''?null:Number(e.target.value));
    panel.querySelector('#pdAgeMax').addEventListener('input', e=>p.ageMaxAtMaturity = e.target.value===''?null:Number(e.target.value));
    panel.querySelector('#pdMinEmp').addEventListener('input', e=>p.minEmploymentMonths = Number(e.target.value||0));
    panel.querySelector('#pdTerm').addEventListener('input', e=>p.maxTermYears = e.target.value===''?null:Number(e.target.value));
    panel.querySelector('#pdCompId').addEventListener('change', e=>p.companiesListId = e.target.value || null);
    panel.querySelector('#pdAmtMin').addEventListener('input', e=>p.loanAmountMin = Number(e.target.value||0));
    panel.querySelector('#pdDocBasis').addEventListener('change', e=>p.docChargeBasis = e.target.value);
    panel.querySelector('#pdDocVal').addEventListener('input', e=>p.docChargeValue = e.target.value===''?null:Number(e.target.value));
    panel.querySelector('#pdDocMin').addEventListener('input', e=>p.docChargeMin = e.target.value===''?null:Number(e.target.value));
    panel.querySelector('#pdDocMax').addEventListener('input', e=>p.docChargeMax = e.target.value===''?null:Number(e.target.value));
    panel.querySelector('#pdBalloonAllowed')?.addEventListener('change', e=>p.balloonAllowed = e.target.value);
    panel.querySelector('#pdBalloonPct')?.addEventListener('input', e=>p.balloonPct = Number(e.target.value||0));
    panel.querySelector('#pdGuarantor').addEventListener('change', e=>p.guarantorRequired = e.target.value);
    panel.querySelector('#pdCollateral').addEventListener('change', e=>p.collateralRequired = e.target.value);
    panel.querySelector('#pdInsurance').addEventListener('change', e=>p.insuranceRequired = e.target.value);
    panel.querySelector('#pdCrib').addEventListener('change', e=>p.cribCheckRequired = e.target.value==='yes');
    panel.querySelector('#pdEarlySettle').addEventListener('change', e=>p.earlySettlementAllowed = e.target.value==='yes');
    panel.querySelector('#pdEarlySettlePct').addEventListener('input', e=>p.earlySettlementChargePct = Number(e.target.value||0));
    panel.querySelector('#pdLatePenalty').addEventListener('input', e=>p.latePaymentPenaltyPct = Number(e.target.value||0));
    panel.querySelector('#pdGrace').addEventListener('input', e=>p.gracePeriodDays = Number(e.target.value||0));
    panel.querySelector('#pdProcessing').addEventListener('input', e=>p.processingDays = Number(e.target.value||0));
    panel.querySelector('#pdSalaryCredit').addEventListener('change', e=>p.salaryCreditRequired = e.target.value==='yes');
    panel.querySelector('#pdCoApplicant').addEventListener('change', e=>p.coApplicantAllowed = e.target.value==='yes');
    panel.querySelector('#pdTopup').addEventListener('input', e=>p.topUpAfterMonths = e.target.value===''?null:Number(e.target.value));
    panel.querySelector('#pdRemarks').addEventListener('input', e=>{ p.remarks = e.target.value.split('\n').map(s=>s.trim()).filter(Boolean); });

    panel.querySelector('#pdSave').addEventListener('click', ()=>{
      if(!p.name || !p.name.trim()) return;
      if(!bank.products) bank.products = [];
      const idx = bank.products.findIndex(x=>x.id===p.id);
      if(idx >= 0) bank.products[idx] = p; else bank.products.push(p);
      logAudit(isNew ? 'Added loan product' : 'Edited loan product', `${bank.name} — ${p.name} (${p.rate}%)`);
      persistBanksToStorage();
      close();
      render();
    });
    panel.querySelector('#pdDelete')?.addEventListener('click', ()=>{
      if(!confirm(`Delete "${p.name}" from ${bank.name}? This can't be undone.`)) return;
      bank.products = (bank.products||[]).filter(x=>x.id!==p.id);
      logAudit('Deleted loan product', `${bank.name} — ${p.name}`);
      persistBanksToStorage();
      close();
      render();
    });
  }
  renderForm();
}

  limitsCard.querySelector('#pensionMaxAge').addEventListener('change', e=>{ state.admin.pensionMaxAge = Number(e.target.value||80); logAudit('Changed setting', `Pension Loan max age cap set to ${state.admin.pensionMaxAge}`); });

  const dtiCard = el(`

/* ---------- Tab 5: User & Access Control ---------- */
/* ---------- Company Lists Tab ---------- */
function renderAdminCompanyListsTab(){
  const wrap = el(`<div class="space-y-4"></div>`);
  const intro = el(`
    <div class="card p-5 sm:p-6">
      <p class="font-display font-semibold text-[15px] mb-1" style="color:var(--teal-900)">Approved employer / hospital lists</p>
      <p class="text-[12.5px]" style="color:var(--text-600)">Referenced by products with "Requires approved employer?" set to Yes (Banks tab → Advanced Settings). Grouped by bank below. Structure-only sample data — each bank's real credit/HR team must supply and periodically update its actual list.</p>
    </div>
  `);
  wrap.appendChild(intro);

  function renderEntriesTable(list){
    const section = el(`
      <div class="p-3.5 rounded-xl" style="background:var(--teal-50)">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-2.5">
          <input type="text" class="list-name font-semibold !w-56" value="${list.name}">
          <button type="button" class="list-remove text-[12px] font-semibold" style="color:var(--danger)"><i class="fa-solid fa-trash mr-1"></i>Delete list</button>
        </div>
        <div class="overflow-x-auto rounded-xl border" style="border-color:var(--line)">
          <table class="w-full text-[13px]">
            <thead><tr class="text-left border-b" style="border-color:var(--line); background:var(--card)">
              <th class="py-2 px-3 font-semibold" style="color:var(--text-600)">Company name</th>
              <th class="py-2 px-3 font-semibold" style="color:var(--text-600)">Tier</th>
              <th class="py-2 px-3 font-semibold" style="color:var(--text-600)">Sector</th>
              <th class="py-2 px-3"></th>
            </tr></thead>
            <tbody class="entries-body"></tbody>
          </table>
        </div>
        <button type="button" class="add-entry-btn text-[12px] font-semibold mt-2" style="color:var(--teal-700)"><i class="fa-solid fa-plus mr-1"></i>Add company</button>
      </div>
    `);
    const entriesBody = section.querySelector('.entries-body');
    function renderEntries(){
      entriesBody.innerHTML = '';
      list.entries.forEach((entry, entryIdx)=>{
        const row = el(`
          <tr class="border-b" style="border-color:var(--line)">
            <td class="py-1.5 px-3"><input type="text" class="entry-name !py-1 text-[13px]" value="${entry.name}"></td>
            <td class="py-1.5 px-3"><input type="text" class="entry-tier !py-1 !w-16 text-[13px]" value="${entry.tier||''}"></td>
            <td class="py-1.5 px-3"><input type="text" class="entry-sector !py-1 text-[13px]" value="${entry.sector||''}"></td>
            <td class="py-1.5 px-3"><button type="button" class="entry-remove w-6 h-6 rounded-full flex items-center justify-center" style="color:var(--danger)"><i class="fa-solid fa-xmark text-[11px]"></i></button></td>
          </tr>
        `);
        row.querySelector('.entry-name').addEventListener('input', e=>entry.name = e.target.value);
        row.querySelector('.entry-tier').addEventListener('input', e=>entry.tier = e.target.value);
        row.querySelector('.entry-sector').addEventListener('input', e=>entry.sector = e.target.value);
        row.querySelector('.entry-remove').addEventListener('click', ()=>{ list.entries.splice(entryIdx,1); renderEntries(); });
        entriesBody.appendChild(row);
      });
    }
    renderEntries();
    section.querySelector('.list-name').addEventListener('input', e=>list.name = e.target.value);
    section.querySelector('.list-remove').addEventListener('click', ()=>{
      state.admin.companyLists = state.admin.companyLists.filter(l=>l!==list);
      render();
    });
    section.querySelector('.add-entry-btn').addEventListener('click', ()=>{ list.entries.push({name:'', tier:'A', sector:''}); renderEntries(); });
    return section;
  }

  // One master card per bank — every bank gets a section, even if it has no lists yet,
  // so adding a bank's first list doesn't need a separate global control.
  state.admin.banks.forEach(bank=>{
    const bankLists = state.admin.companyLists.filter(l=>l.bankId===bank.id);
    const card = el(`
      <div class="card p-5 sm:p-6">
        <div class="flex items-center justify-between gap-3 mb-3">
          <p class="font-display font-semibold text-[15px]" style="color:var(--teal-900)">${bank.name}</p>
          <button type="button" class="add-list-btn btn-ghost px-3 py-1.5 rounded-lg text-[12px]"><i class="fa-solid fa-plus mr-1.5"></i>Add list</button>
        </div>
        <div class="lists-container space-y-3">
          ${bankLists.length === 0 ? `<p class="text-[12.5px]" style="color:var(--text-400)">No approved lists yet for this bank.</p>` : ''}
        </div>
      </div>
    `);
    const listsContainer = card.querySelector('.lists-container');
    bankLists.forEach(list=>{ listsContainer.appendChild(renderEntriesTable(list)); });
    card.querySelector('.add-list-btn').addEventListener('click', ()=>{
      state.admin.companyLists.push({ id:'list_'+Date.now(), bankId: bank.id, name:'New Approved List', entries:[] });
      render();
    });
    wrap.appendChild(card);
  });

  return wrap;
}

      <p class="font-display font-semibold text-[15px] mb-1" style="color:var(--teal-900)">Registered users &amp; roles</p>

      </div>
      <div class="overflow-x-auto rounded-xl border" style="border-color:var(--line)">
        <table class="w-full text-[13px]">
          <thead>
            <tr class="text-left border-b" style="border-color:var(--line); background:var(--teal-50)">
              <th class="py-2.5 px-3 font-semibold" style="color:var(--text-600)">Email</th>
              <th class="py-2.5 px-3 font-semibold" style="color:var(--text-600)">Name</th>
              <th class="py-2.5 px-3 font-semibold" style="color:var(--text-600)">Role</th>
              <th class="py-2.5 px-3"></th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>
    </div>
  `);

  const tbody = card.querySelector('#usersTableBody');
  function buildRows(){
    tbody.innerHTML = '';
    state.admin.users.forEach(u=>{
      const isSeedAdmin = u.email === 'admin@waby.lk';
      const row = el(`
        <tr class="border-b" style="border-color:var(--line)">
          <td class="py-2.5 px-3 font-mono">${u.email}</td>
          <td class="py-2.5 px-3">${u.name}</td>
          <td class="py-2.5 px-3"><span class="badge ${u.role==='admin'?'badge-violet':'badge-teal'}">${u.role==='admin'?'Admin':'User'}</span></td>
          <td class="py-2.5 px-3">
            ${isSeedAdmin
              ? `<span class="text-[11.5px]" style="color:var(--text-400)">Protected account</span>`
              : `<button type="button" class="role-toggle-btn btn-ghost px-3 py-1.5 rounded-lg text-[12px]">Make ${u.role==='admin'?'User':'Admin'}</button>`}
          </td>
        </tr>
      `);
      row.querySelector('.role-toggle-btn')?.addEventListener('click', ()=>{
        const oldRole = u.role;
        u.role = u.role === 'admin' ? 'user' : 'admin';
        logAudit('Changed user role', `${u.email}: ${oldRole} → ${u.role}`);
        buildRows();
      });
      tbody.appendChild(row);
    });
  }
  buildRows();

  card.querySelector('#addUserBtn').addEventListener('click', ()=>{
    const input = card.querySelector('#newUserEmail');
    const email = input.value.trim();
    if(!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return;
    if(state.admin.users.find(u=>u.email===email)) { input.value=''; return; }
    state.admin.users.push({ email, name: email.split('@')[0], role:'admin' });
    input.value = '';
    buildRows();
  });

  return card;
}

/* =========================================================================
   GLOBAL LISTENERS
   ========================================================================= */
function attachGlobalListeners(){
  const adminConsoleToggleBtn = document.getElementById('adminConsoleToggleBtn');
  if(adminConsoleToggleBtn) adminConsoleToggleBtn.addEventListener('click', ()=>{ state.view = state.view === 'user' ? 'admin' : 'user'; render(); });

  const themeToggle = document.getElementById('themeToggle');
  if(themeToggle) themeToggle.addEventListener('click', ()=>{ state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); });

  const adminSignOutBtn = document.getElementById('adminSignOutBtn');
  if(adminSignOutBtn) adminSignOutBtn.addEventListener('click', ()=>{ state.auth = null; state.view = 'user'; render(); });

  const langSelect = document.getElementById('langSelect');
  if(langSelect) langSelect.addEventListener('change', e=>{ state.lang = e.target.value; render(); });

  const authArea = document.getElementById('authArea');
  if(authArea){
    if(state.auth){
      const initials = (state.auth.name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
      authArea.innerHTML = `<button id="authChip" class="flex items-center gap-2 pl-1 pr-3 py-1 rounded-full" style="background:var(--teal-100)"><span class="w-6 h-6 rounded-full flex items-center justify-center text-[10px] font-bold text-white" style="background:var(--teal-700)">${initials}</span><span class="text-[12.5px] font-semibold hidden sm:inline" style="color:var(--teal-800)">${state.auth.name}</span></button>`;
      authArea.querySelector('#authChip').addEventListener('click', ()=>{ state.auth = null; render(); });
    } else {
      authArea.innerHTML = `<button id="authOpenBtn" class="btn-ghost px-3 py-1.5 rounded-xl text-[12.5px]"><i class="fa-solid fa-user mr-1.5"></i>${t('signIn')}</button>`;
      authArea.querySelector('#authOpenBtn').addEventListener('click', ()=>{ state.authPanelOpen = !state.authPanelOpen; render(); });
    }
  }
}

render();
</script>
</body>
</html>
