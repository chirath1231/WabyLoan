function getStepMeta(){ return [ {n:1,label:t('step1')}, {n:2,label:t('step2')}, {n:3,label:t('step3')}, {n:4,label:t('step4')}, {n:5,label:t('step5')} ]; }

function renderStepper(){
  const stepMeta = getStepMeta();
  const wrap = el(`<div></div>`);

  // Compact mobile version — a slim progress bar + "Step X of 5" label, so the full
  // 5-stamp rail (which needs horizontal scroll on narrow screens) doesn't eat vertical
  // space on the device most Sri Lankan users will actually be on.
  const pct = Math.round((state.step / stepMeta.length) * 100);
  wrap.appendChild(el(`
    <div class="sm:hidden pt-5 pb-4">
      <div class="flex items-center justify-between mb-2">
        <span class="text-[12.5px] font-semibold" style="color:var(--teal-800)">Step ${state.step} of ${stepMeta.length}</span>
        <span class="text-[12px] font-semibold" style="color:var(--text-400)">${stepMeta[state.step-1]?.label || ''}</span>
      </div>
      <div class="w-full h-1.5 rounded-full" style="background:var(--line)">
        <div class="h-1.5 rounded-full" style="background:var(--teal-700); width:${pct}%; transition:width .3s ease;"></div>
      </div>
    </div>
  `));

  // Full desktop stepper
  const desktopWrap = el(`<div class="hidden sm:block pt-8 pb-6 overflow-x-auto"></div>`);
  const rail = el(`<div class="flex items-center min-w-[420px]"></div>`);
  stepMeta.forEach((s, idx)=>{
    const status = state.step > s.n ? 'done' : (state.step === s.n ? 'active' : '');
    rail.appendChild(el(`
      <div class="flex flex-col items-center gap-2" style="min-width:64px">
        <div class="stamp ${status}">${state.step > s.n ? '<i class="fa-solid fa-check"></i>' : s.n}</div>
        <span class="text-[11.5px] font-semibold text-center leading-tight" style="color:${state.step>=s.n?'var(--teal-800)':'var(--text-400)'}">${s.label}</span>
      </div>
    `));
    if(idx < stepMeta.length-1) rail.appendChild(el(`<div class="ledger-line mb-6" style="--fill:${state.step > s.n ? 1 : 0}"></div>`));
  });
  desktopWrap.appendChild(rail);
  wrap.appendChild(desktopWrap);
  return wrap;
}

function renderStepBody(){
  const wrap = el(`<div class="fade-in"></div>`);
  const map = { 1:renderStep1, 2:renderStep2, 3:renderStep3, 4:renderStep4, 5:renderStep5 };
  wrap.appendChild(map[state.step]());
  return wrap;
}

/* ---------- STEP 1 ---------- */
function renderStep1(){
  const categories = [
    { id:'personal', icon:'fa-wallet', title:'Personal Loan', desc:'For medical, wedding, or urgent cash needs. Doctors, Engineers &amp; other eligible professions automatically see a discounted scheme too.' },
    { id:'housing', icon:'fa-house', title:'Housing Loan', desc:'To buy land, build, or renovate.' },
    { id:'vehicle', icon:'fa-car', title:'Vehicle Leasing', desc:'For cars, vans, or bikes.' },
    { id:'pension', icon:'fa-hand-holding-heart', title:'Pension Loan', desc:'For retirees borrowing against a pension income.' },
    { id:'business', icon:'fa-briefcase', title:'Business Loan', desc:'For stock, equipment, or growing your business.' },
  ];
  const wrap = el(`
    <section class="card p-6 sm:p-8">
      <h2 class="font-display text-xl font-bold" style="color:var(--teal-900)">${t('step1Title')}</h2>
      <p class="text-sm mt-1" style="color:var(--text-600)">${t('step1Sub')}</p>
      <div class="grid sm:grid-cols-2 gap-4 mt-6" id="catGrid"></div>
      <div class="flex justify-end mt-8">
        <button id="toStep2" class="btn-primary px-6 py-2.5 rounded-xl text-sm" ${state.loanCategory?'':'disabled'}>${t('continue')} <i class="fa-solid fa-arrow-right ml-1.5 text-xs"></i></button>
      </div>
    </section>
  `);
  const grid = wrap.querySelector('#catGrid');
  categories.forEach(c=>{
    const isBusinessDisabled = c.id === 'business' && !state.admin.featureFlags.businessLoanEnabled;
    const card = el(`
      <div class="choice-card p-5 flex items-start gap-4 ${state.loanCategory===c.id?'selected':''} ${isBusinessDisabled?'disabled-card':''}" data-cat="${c.id}">
        <div class="w-11 h-11 rounded-full flex items-center justify-center flex-shrink-0" style="background:${c.special?'var(--violet-100)':'var(--teal-100)'}; color:${c.special?'var(--violet-700)':'var(--teal-700)'}"><i class="fa-solid ${c.icon}"></i></div>
        <div>
          <div class="flex items-center gap-2 flex-wrap">
            <p class="font-semibold text-[15px]">${c.title}</p>
            ${c.special?'<span class="badge badge-violet">DISCOUNTED SCHEME</span>':''}
            ${isBusinessDisabled?'<span class="badge badge-grey">COMING SOON</span>':''}
          </div>
          <p class="text-[13px] mt-0.5" style="color:var(--text-600)">${c.desc}</p>
        </div>
      </div>
    `);
    if(isBusinessDisabled){
      grid.appendChild(card);
      return;
    }
    makeSelectable(card, ()=>{ state.loanCategory = c.id; render(); });
    grid.appendChild(card);
  });
  wrap.querySelector('#toStep2').addEventListener('click', ()=>{ if(state.loanCategory){ state.step=2; render(); }});
  return wrap;
}

/* ---------- STEP 2 ---------- */
function renderStep2(){
  const wrap = el(`
    <section class="card p-6 sm:p-8">
      <h2 class="font-display text-xl font-bold" style="color:var(--teal-900)">${t('step2Title')}</h2>
      <p class="text-sm mt-1" style="color:var(--text-600)">${t('step2Sub')}</p>

      <div class="mt-6"><label class="field-label">Employment sector</label><div class="grid grid-cols-2 sm:grid-cols-4 gap-3" id="sectorGrid"></div></div>

      <div class="mt-6">
        <label class="field-label">Occupation / profession</label>
        <select id="occSelect" class="max-w-sm"><option value="">Select occupation</option>
          ${state.admin.occupations.map(o=>`<option value="${o.id}" ${state.occupation===o.id?'selected':''}>${o.label}</option>`).join('')}
        </select>
        <div id="customOccWrap" class="mt-3 max-w-sm ${state.occupation==='general'?'':'hidden'}">
          <label class="field-label">Your exact job title</label>
          <input type="text" id="customOccInput" value="${state.applicant.customOccupation||''}" placeholder="e.g. Electrician, Shop Owner, Driver, Sales Executive">
        </div>
      </div>
      <div id="occNote" class="mt-4"></div>

      <div class="mt-6 max-w-sm">
        <label class="field-label flex items-center gap-1.5">Gender <span class="font-normal" style="color:var(--text-400)">(optional)</span>
          <span class="tooltip-trigger"><i class="fa-solid fa-circle-info text-[11px]" style="color:var(--text-400)"></i>
            <span class="tooltip-bubble">Only used to show you special women-only loan schemes where available (e.g. Kanthadhiriya). Skip this if you'd rather not say.</span>
          </span>
        </label>
        <div class="flex gap-2 items-center" id="genderToggle">
          <button type="button" data-gender="female" class="obligations-answer-btn px-6 py-2 text-sm font-semibold">Female</button>
          <button type="button" data-gender="male" class="obligations-answer-btn px-6 py-2 text-sm font-semibold">Male</button>
          ${state.applicant.gender ? `<button type="button" id="clearGender" class="text-[12px] font-semibold" style="color:var(--text-400)">Clear</button>` : ''}
        </div>
      </div>

      ${state.sector !== 'self_employed' ? `
      <div class="mt-6 grid sm:grid-cols-2 gap-5 max-w-xl">
        <div>
          <label class="field-label flex items-center gap-1.5">Employer name <span class="font-normal" style="color:var(--text-400)">(optional)</span>
            <span class="tooltip-trigger"><i class="fa-solid fa-circle-info text-[11px]" style="color:var(--text-400)"></i>
              <span class="tooltip-bubble">Some banks offer better rates to employees of specific companies. We'll check this automatically — skip if you'd rather not say.</span>
            </span>
          </label>
          <input type="text" id="employerNameInput" value="${state.employerName||''}" placeholder="e.g. Dialog Axiata PLC">
        </div>
        <div>
          <label class="field-label">Time in current job <span class="font-normal" style="color:var(--text-400)">(optional)</span></label>
          <input type="number" id="employmentMonthsInput" min="0" value="${state.employmentMonths ?? ''}" placeholder="Months, e.g. 24">
        </div>
      </div>` : ''}

      <div class="mt-6 max-w-xl p-4 rounded-xl" style="background:var(--teal-50)">
        <p class="text-[12.5px] font-semibold" style="color:var(--text-600)"><i class="fa-solid fa-hourglass-half mr-1.5"></i>${state.loanCategory==='pension' ? 'Age & maximum loan age limit' : 'Your Age &amp; Retirement'}</p>
        ${state.loanCategory==='pension' ? '' : '<p class="hint !mt-0.5 mb-3">We use your age to automatically calculate how many years banks will allow you to repay.</p>'}
        <div class="grid sm:grid-cols-2 gap-5 ${state.loanCategory==='pension' ? 'mt-3' : ''}">
          <div><label class="field-label">Applicant age</label><input type="number" id="ageInput" min="18" max="${maxValidApplicantAge()}" placeholder="e.g. 35" value="${state.applicant.age ?? ''}"><p id="ageError" class="hint hidden" style="color:var(--danger)">Age should be between 18 and ${maxValidApplicantAge()}.</p></div>
          <div>
            <label class="field-label flex items-center gap-1.5">${state.loanCategory==='pension' ? 'Maximum age for this loan' : 'When do you plan to retire?'}
              <span class="tooltip-trigger"><i class="fa-solid fa-circle-info text-[11px]" style="color:var(--text-400)"></i>
                <span class="tooltip-bubble">${state.loanCategory==='pension'
                  ? `Pension loans are typically capped at age ${state.admin.pensionMaxAge} at final repayment — edit if this bank's policy differs.`
                  : 'Pre-filled from your sector (60 for Government / Semi-Government / Private, 65 for Self-Employed) — edit if your actual retirement age differs.'}</span>
              </span>
            </label>
            <input type="number" id="retireAgeInput" min="${(Number(state.applicant.age)||18)+1}" max="90" placeholder="${state.loanCategory==='pension' ? `e.g. ${state.admin.pensionMaxAge}` : (state.sector ? 'e.g. 60' : 'Select a sector first')}" value="${state.applicant.retirementAge ?? ''}">
          </div>
        </div>
        <div id="retireHint" class="mt-3"></div>
      </div>

      ${state.loanCategory==='housing' ? `
      <div class="mt-6 max-w-xl p-4 rounded-xl" style="background:var(--teal-50)">
        <div class="flex items-center justify-between">
          <div>
            <p class="text-[13.5px] font-semibold">Add a joint applicant</p>
            <p class="text-[12px]" style="color:var(--text-600)">Combine a spouse or co-applicant's income — <span class="font-semibold" style="color:var(--teal-700)">recommended for Housing Loans</span>, since most housing facilities are assessed on combined household income.</p>
          </div>
          <div id="jointToggle" class="toggle ${state.applicant.jointApplicant?'on':''}"><div class="dot"></div></div>
        </div>
        <div id="jointIncomeWrap" class="mt-3 ${state.applicant.jointApplicant?'':'hidden'}">
          <label class="field-label">Co-applicant monthly gross income (LKR)</label>
          <input type="text" id="coApplicantIncome">
        </div>
      </div>` : ''}

      <div class="flex justify-between mt-8">
        <button id="back1" class="btn-ghost px-5 py-2.5 rounded-xl text-sm">${t('back')}</button>
        <button id="toStep3" class="btn-primary px-6 py-2.5 rounded-xl text-sm" ${(state.sector && state.occupation && isValidAge(state.applicant.age))?'':'disabled'}>${t('continue')} <i class="fa-solid fa-arrow-right ml-1.5 text-xs"></i></button>
      </div>
    </section>
  `);

  const sectorGrid = wrap.querySelector('#sectorGrid');
  [
    {id:'government',label:'Government',icon:'fa-landmark'},
    {id:'semi_government',label:'Semi-Government',icon:'fa-city'},
    {id:'private',label:'Private Sector',icon:'fa-building'},
    {id:'self_employed',label:'Self-Employed',icon:'fa-user-tie'},
  ].forEach(s=>{
    const c = el(`
      <div class="choice-card p-4 text-center ${state.sector===s.id?'selected':''}" data-sector="${s.id}">
        <i class="fa-solid ${s.icon} text-lg" style="color:var(--teal-700)"></i>
        <p class="font-semibold text-[13.5px] mt-2">${s.label}</p>
      </div>
    `);
    makeSelectable(c, ()=>{
      state.sector = s.id;
      if(!state.applicant.retirementAgeCustom) state.applicant.retirementAge = defaultAgeCapForContext(s.id);
      render();
    });
    sectorGrid.appendChild(c);
  });

  wrap.querySelector('#occSelect').addEventListener('change', e=>{
    state.occupation = e.target.value || null;
    render();
    if(state.occupation === 'general'){
      document.getElementById('customOccInput')?.focus();
    }
  });
  const customOccInput = wrap.querySelector('#customOccInput');
  customOccInput.addEventListener('input', e=>{ state.applicant.customOccupation = e.target.value; });

  wrap.querySelectorAll('#genderToggle [data-gender]').forEach(btn=>{
    btn.classList.toggle('selected', state.applicant.gender === btn.dataset.gender);
    btn.addEventListener('click', ()=>{ state.applicant.gender = btn.dataset.gender; render(); });
  });
  wrap.querySelector('#clearGender')?.addEventListener('click', ()=>{ state.applicant.gender = null; render(); });
  wrap.querySelector('#employerNameInput')?.addEventListener('input', e=>{ state.employerName = e.target.value; });
  wrap.querySelector('#employmentMonthsInput')?.addEventListener('input', e=>{ state.employmentMonths = e.target.value===''?null:Number(e.target.value); });

  function updateRetireHint(){
    const box = wrap.querySelector('#retireHint');
    const age = state.applicant.age;
    const retireAge = state.applicant.retirementAge;
    const ageValid = isValidAge(age);
    const retireValid = typeof retireAge === 'number' && !isNaN(retireAge) && retireAge > 0;
    const isPension = state.loanCategory === 'pension';
    const ageFieldName = isPension ? 'maximum age for this loan' : 'expected retirement age';
    if(!ageValid || !retireValid){
      box.innerHTML = `<p class="hint !mt-0">Enter your age and ${ageFieldName} to see your maximum loan tenure.</p>`;
      return;
    }
    const remaining = Math.max(retireAge - age, 0);
    if(retireAge <= age){
      box.innerHTML = `<div class="flex items-start gap-2.5 p-3 rounded-xl" style="background:var(--danger-100)"><i class="fa-solid fa-hourglass-end mt-0.5 text-[12px]" style="color:var(--danger)"></i><p class="text-[12.5px]" style="color:var(--danger)"><span class="font-semibold">${isPension?'Maximum age limit reached or exceeded.':'Retirement age reached or exceeded.'}</span> Standard tenure-based lending will not be available at this age.</p></div>`;
    } else if(remaining <= 5){
      box.innerHTML = `<div class="flex items-start gap-2.5 p-3 rounded-xl" style="background:var(--amber-100)"><i class="fa-solid fa-triangle-exclamation mt-0.5 text-[12px]" style="color:var(--amber-700)"></i><p class="text-[12.5px]" style="color:var(--amber-700)">${isPension?`You'll reach the maximum age limit in`:'Retirement in'} <span class="font-semibold">${remaining} year${remaining===1?'':'s'}</span> — maximum tenure capped at <span class="font-semibold">${remaining} year${remaining===1?'':'s'}</span>.</p></div>`;
    } else {
      box.innerHTML = `<p class="hint !mt-0">Maximum loan tenure available: <span class="font-mono font-semibold">${remaining} years</span> (${isPension?'Maximum Loan Age':'Expected Retirement Age'} − Applicant Age).</p>`;
    }
  }
  updateRetireHint();

  wrap.querySelector('#ageInput').addEventListener('input', e=>{
    const raw = e.target.value;
    state.applicant.age = raw === '' ? null : Number(raw);
    const invalid = raw !== '' && !isValidAge(state.applicant.age);
    wrap.querySelector('#ageError').classList.toggle('hidden', !invalid);
    wrap.querySelector('#ageInput').classList.toggle('invalid', invalid);
    wrap.querySelector('#toStep3').disabled = !(state.sector && state.occupation && isValidAge(state.applicant.age));
    updateRetireHint();
  });
  wrap.querySelector('#retireAgeInput').addEventListener('input', e=>{
    const raw = e.target.value;
    state.applicant.retirementAge = raw === '' ? null : Number(raw);
    state.applicant.retirementAgeCustom = true;
    updateRetireHint();
  });

  const jointToggle = wrap.querySelector('#jointToggle');
  if(jointToggle){
    jointToggle.addEventListener('click', ()=>{ state.applicant.jointApplicant = !state.applicant.jointApplicant; render(); });
    const coInput = wrap.querySelector('#coApplicantIncome');
    bindMoneyInput(coInput, ()=>state.applicant.coApplicantIncome, v=>state.applicant.coApplicantIncome=v);
  } else if(state.applicant.jointApplicant){
    // Category changed away from Housing while the toggle was on — reset it so no
    // stale co-applicant income can leak into a different category's calculation.
    state.applicant.jointApplicant = false;
  }

  const noteBox = wrap.querySelector('#occNote');
  const occObj = state.admin.occupations.find(o=>o.id===state.occupation);
  if(occObj && occObj.id === 'general'){
    wrap.querySelector('#customOccWrap').classList.remove('hidden');
  }
  if(occObj && occObj.special){
    noteBox.appendChild(el(`
      <div class="flex items-start gap-3 p-3.5 rounded-xl" style="background:var(--violet-100)">
        <i class="fa-solid fa-star mt-0.5" style="color:var(--violet-700)"></i>
        <p class="text-[13px]" style="color:var(--violet-700)"><span class="font-semibold">You may qualify for a discounted Special Scheme.</span> As a ${occObj.label}, if you choose Personal Loan we'll automatically show you both a bank's discounted Special Scheme and its standard General Scheme side by side in Step 5 — no separate category to pick.</p>
      </div>
    `));
  } else if(occObj){
    noteBox.appendChild(el(`<div class="text-[12.5px]" style="color:var(--text-400)">Standard interest rates will apply for this occupation.</div>`));
  }

  wrap.querySelector('#back1').addEventListener('click', ()=>{ state.step=1; render(); });
  wrap.querySelector('#toStep3').addEventListener('click', ()=>{ if(state.sector && state.occupation){ state.step=3; render(); }});
  return wrap;
}

/* ---------- STEP 3 ---------- */
function renderStep3(){
  if(state.loanCategory === 'business') return renderStep3Business();
  if(state.loanCategory === 'pension') return renderStep3Pension();
  if(state.sector === 'self_employed') return renderStep3SelfEmployed();
  return renderStep3Payslip();
}

function renderStep3Business(){
  const wrap = el(`
    <section class="card p-6 sm:p-8">
      <h2 class="font-display text-xl font-bold" style="color:var(--teal-900)">Business cash flow</h2>
      <p class="text-sm mt-1" style="color:var(--text-600)">Provide your average monthly revenue and operating expenses. Net profit determines your eligibility.</p>
      <div class="grid sm:grid-cols-2 gap-5 mt-6 max-w-xl">
        <div><label class="field-label">Average Monthly Revenue (LKR)</label><input type="text" id="bizRevenue"></div>
        <div><label class="field-label">Average Monthly Expenses (LKR)</label><input type="text" id="bizExpenses"></div>
      </div>
      <div id="bizNetBox" class="mt-5 stat-tile p-4 max-w-xl flex items-center justify-between"></div>
      <div class="flex justify-between mt-8">
        <button id="back2" class="btn-ghost px-5 py-2.5 rounded-xl text-sm">${t('back')}</button>
        <button id="toStep4" class="btn-primary px-6 py-2.5 rounded-xl text-sm">Continue <i class="fa-solid fa-arrow-right ml-1.5 text-xs"></i></button>
      </div>
    </section>
  `);
  function updateNet(){
    const net = state.business.revenue - state.business.expenses;

function renderStep3Payslip(){

          </button>
          <button data-mode="manual" class="income-tab px-4 py-2 rounded-lg text-[13px] font-semibold transition-all" role="tab" aria-selected="${p.mode==='manual'}">

          <span class="w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0" style="background:var(--teal-100)"><i class="fa-solid fa-play text-[9px]" style="color:var(--teal-700)"></i></span>
          Watch 1-min Helper Video <span class="hidden sm:inline">(Fixed vs Non-Fixed income)</span>
        </button>
      </div>

      <div id="incomeModeBody" class="mt-6 fade-in"></div>

      <div class="flex justify-between mt-8">
        <button id="back2" class="btn-ghost px-5 py-2.5 rounded-xl text-sm">${t('back')}</button>
        <button id="toStep4" class="btn-primary px-6 py-2.5 rounded-xl text-sm" ${canContinue?'':'disabled'}>Continue <i class="fa-solid fa-arrow-right ml-1.5 text-xs"></i></button>
      </div>
    </section>
  `);

  function paintTabs(){
    wrap.querySelectorAll('.income-tab').forEach(btn=>{
      const active = btn.dataset.mode === p.mode;
      btn.style.background = active ? '#fff' : 'transparent';
      btn.style.color = active ? 'var(--teal-800)' : 'var(--text-600)';
      btn.style.boxShadow = active ? '0 1px 4px rgba(0,53,47,0.12)' : 'none';
    });
  }
  paintTabs();
  wrap.querySelectorAll('.income-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ if(p.mode === btn.dataset.mode) return; p.mode = btn.dataset.mode; render(); });
  });

  const modeBody = wrap.querySelector('#incomeModeBody');
  if(p.mode === 'upload'){
    modeBody.innerHTML = `
      <div id="uploadZone" class="border-2 border-dashed rounded-2xl p-8 text-center cursor-pointer" style="border-color:var(--line)">
        <i class="fa-solid fa-file-arrow-up text-2xl" style="color:var(--teal-600)"></i>

      </div>
      <div id="extractionZone" class="mt-6"></div>
    `;
    modeBody.appendChild(renderTrilingualPrivacyNotice());
    modeBody.querySelector('#uploadZone').addEventListener('click', ()=>{ if(p.extracted) return; p.uploaded = true; render(); simulateExtraction(); });
    if(p.uploaded && !p.extracted) renderExtractionLoading(modeBody.querySelector('#extractionZone'));
    if(p.extracted) renderExtractionResult(modeBody.querySelector('#extractionZone'));
  } else {
    renderManualIncomeEntry(modeBody);
    modeBody.appendChild(renderPrivacyNote('No document required. These figures are used only for this eligibility calculation and are not saved.'));
  }

  wrap.querySelector('#helperVideoBtn').addEventListener('click', openHelperVideoModal);
  wrap.querySelector('#back2').addEventListener('click', ()=>{ state.step=2; render(); });
  wrap.querySelector('#toStep4')?.addEventListener('click', ()=>{
    const stillCanContinue = p.mode === 'manual' ? (p.manual.simpleMode ? Number(p.manual.simpleNetSalary||0) > 0 : Number(p.manual.basic||0) > 0) : p.extracted;
    if(stillCanContinue){ state.step=4; render(); }
  });
  return wrap;
}

        <div id="itemsList"></div>
      </div>
    </div>
  `);

    const row = el(`
      <div class="item-row">
        <input type="checkbox" data-item="${item.id}" ${item.checked?'checked':''} ${item.locked?'disabled':''} class="w-4 h-4" style="accent-color:var(--teal-700)">
        <span data-role="label" class="text-[13.5px] ${item.checked?'':'line-through opacity-50'}">${item.label} ${item.locked?'<span class="text-[10px] font-semibold ml-1" style="color:var(--text-400)">MANDATORY</span>':''}</span>
        <span class="type-badge badge ${item.fixed?'badge-teal':'badge-amber'}">${item.fixed?'Fixed':'Non-Fixed'}</span>

        <input type="text" data-role="amount" class="amt-input !w-28 text-right font-mono text-[13px] ${item.checked?'':'opacity-40'}">

    `);
    const chk = row.querySelector('input[type=checkbox]');
    const amtInput = row.querySelector('[data-role="amount"]');
    chk.addEventListener('change', (e)=>{
      item.checked = e.target.checked;
      row.querySelector('[data-role="label"]').classList.toggle('line-through', !item.checked);
      row.querySelector('[data-role="label"]').classList.toggle('opacity-50', !item.checked);
      amtInput.classList.toggle('opacity-40', !item.checked);
      updateSummary();
    });
    bindMoneyInput(amtInput, ()=>item.amount, v=>{ item.amount = v; updateSummary(); });
    list.appendChild(row);
  });

  function updateSummary(){
    const earnings = p.items.filter(i=>i.type==='earning' && i.checked).reduce((s,i)=>s+Number(i.amount||0),0);
    const deductions = p.items.filter(i=>i.type==='deduction' && i.checked).reduce((s,i)=>s+Number(i.amount||0),0);
    const net = earnings - deductions;
    box.querySelector('#summaryBox').innerHTML = `

    `;
  }
  updateSummary();
}

        </div>
        <div id="simpleModeToggle" class="toggle ${m.simpleMode?'':'on'}"><div class="dot"></div></div>
      </div>

      <div id="detailedFields" class="${m.simpleMode?'hidden':''}">
        <div class="max-w-2xl mt-5"><label class="field-label">Basic Salary (LKR) <span class="badge badge-teal ml-1">FIXED</span></label><input type="text" id="manBasic" class="max-w-xs"></div>

        <div class="flex items-center justify-between mt-5 max-w-2xl p-3.5 rounded-xl" style="background:var(--teal-50)">

            <p class="text-[13.5px] font-semibold">Add itemized breakdown</p>

            </span>

        <div id="lumpSumFields" class="grid sm:grid-cols-2 gap-5 mt-5 max-w-2xl ${m.itemized?'hidden':''}">

              <div id="allowanceRows" class="space-y-2"></div>
              <button id="addAllowance" type="button" class="text-[12.5px] font-semibold mt-2" style="color:var(--teal-700)"><i class="fa-solid fa-plus mr-1"></i>Add allowance</button>

  `);
  container.appendChild(box);

  function allowanceTotal(){
    return m.itemized
      ? m.allowanceItems.filter(i=>i.checked).reduce((s,i)=>s+Number(i.amount||0),0)
      : Number(m.allowances||0);
  }
  function deductionTotal(){
    return m.itemized
      ? m.deductionItems.filter(i=>i.checked).reduce((s,i)=>s+Number(i.amount||0),0)
      : Number(m.deductions||0);
  }

  function updateSummary(){
    const warnBox = box.querySelector('#manWarning');

    let blocking = false;

    if(m.simpleMode){

      if(btn) btn.disabled = !(Number(m.simpleNetSalary||0) > 0);
      return;

    const gross = Number(m.basic||0) + allowanceTotal();
    const deductions = deductionTotal();
    const net = gross - deductions;

    if(deductions > gross && gross > 0){
      blocking = true;
      warnBox.appendChild(el(`<div class="flex items-start gap-3 p-3.5 rounded-xl" style="background:var(--danger-100)"><i class="fa-solid fa-triangle-exclamation mt-0.5" style="color:var(--danger)"></i><p class="text-[13px]" style="color:var(--danger)"><span class="font-semibold">Deductions exceed gross salary.</span> Please review your figures — this would leave zero income for loan repayment.</p></div>`));
    } else if(Number(m.basic||0) > 0 && allowanceTotal() > Number(m.basic||0) * 1.5){
      warnBox.appendChild(el(`<div class="flex items-start gap-3 p-3.5 rounded-xl" style="background:var(--amber-100)"><i class="fa-solid fa-circle-exclamation mt-0.5" style="color:var(--amber-700)"></i><p class="text-[13px]" style="color:var(--amber-700)">Your allowances are unusually high relative to Basic Salary — worth double-checking against your payslip.</p></div>`));
    }

    summaryBox.className = 'grid sm:grid-cols-3 gap-3 mt-5 max-w-2xl';
    summaryBox.innerHTML = `
      <div class="stat-tile p-4"><p class="text-[11px] font-semibold" style="color:var(--text-400)">GROSS SALARY</p><p class="font-mono font-bold text-[18px] mt-1" style="color:var(--teal-800)">${fmt(gross)}</p></div>
      <div class="stat-tile p-4"><p class="text-[11px] font-semibold" style="color:var(--text-400)">TOTAL DEDUCTIONS</p><p class="font-mono font-bold text-[18px] mt-1" style="color:var(--danger)">${fmt(deductions)}</p></div>
      <div class="stat-tile p-4" style="background:${net<0?'var(--danger)':'var(--teal-700)'}"><p class="text-[11px] font-semibold text-white/70">NET SALARY</p><p class="font-mono font-bold text-[18px] mt-1 text-white">${fmt(net)}</p></div>
    `;

    const btn = document.getElementById('toStep4');
    if(btn) btn.disabled = !(Number(m.basic||0) > 0) || blocking;
  }

  function renderAllowanceRows(){
    const wrapEl = box.querySelector('#allowanceRows');
    wrapEl.innerHTML = '';
    m.allowanceItems.forEach(item=>{
      const row = el(`
        <div class="flex items-center gap-2">
          <input type="checkbox" ${item.checked?'checked':''} class="w-4 h-4 flex-shrink-0" style="accent-color:var(--teal-700)">
          <input type="text" value="${item.label}" class="!w-32 sm:!w-36 text-[12.5px]">
          <input type="text" class="amt-input flex-1">
          <button type="button" class="text-[13px] flex-shrink-0" style="color:var(--text-400)"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `);
      const [chk, labelInput, amtInput, removeBtn] = row.querySelectorAll('input, button');
      chk.addEventListener('change', e=>{ item.checked = e.target.checked; updateSummary(); });
      labelInput.addEventListener('input', e=>{ item.label = e.target.value; });
      bindMoneyInput(amtInput, ()=>item.amount, v=>{ item.amount = v; updateSummary(); });
      removeBtn.addEventListener('click', ()=>{ m.allowanceItems = m.allowanceItems.filter(i=>i.id!==item.id); renderAllowanceRows(); updateSummary(); });
      wrapEl.appendChild(row);
    });
  }

  function renderDeductionRows(){
    const wrapEl = box.querySelector('#deductionRows');
    wrapEl.innerHTML = '';
    m.deductionItems.forEach(item=>{
      const row = el(`
        <div>
          <div class="flex items-center gap-2">
            <input type="checkbox" ${item.checked?'checked':''} class="w-4 h-4 flex-shrink-0" style="accent-color:var(--teal-700)">
            <input type="text" value="${item.label}" class="!w-32 sm:!w-36 text-[12.5px]">
            <input type="text" class="amt-input flex-1">
            <button type="button" class="text-[13px] flex-shrink-0" style="color:var(--text-400)"><i class="fa-solid fa-xmark"></i></button>
            ${item.suggested ? '<span class="badge badge-teal flex-shrink-0">SUGGESTED</span>' : ''}
          </div>
          ${item.id==='d_apit' ? '<p class="hint ml-6">Check your payslip or current IRD tax tables for your exact APIT figure.</p>' : ''}
        </div>
      `);
      const [chk, labelInput, amtInput, removeBtn] = row.querySelectorAll('input, button');
      chk.addEventListener('change', e=>{ item.checked = e.target.checked; updateSummary(); });
      labelInput.addEventListener('input', e=>{ item.label = e.target.value; });
      bindMoneyInput(amtInput, ()=>item.amount, v=>{ item.amount = v; item.suggested = false; updateSummary(); });
      removeBtn.addEventListener('click', ()=>{ m.deductionItems = m.deductionItems.filter(i=>i.id!==item.id); renderDeductionRows(); updateSummary(); });
      wrapEl.appendChild(row);
    });
  }

  box.querySelector('#addAllowance').addEventListener('click', ()=>{
    m.allowanceItems.push({ id:'a_'+Date.now(), label:'New Allowance', amount:0, checked:true });
    renderAllowanceRows(); updateSummary();
  });
  box.querySelector('#addDeduction').addEventListener('click', ()=>{
    m.deductionItems.push({ id:'d_'+Date.now(), label:'New Deduction', amount:0, checked:true });
    renderDeductionRows(); updateSummary();
  });

  box.querySelector('#itemizeToggle').addEventListener('click', (e)=>{
    m.itemized = !m.itemized;
    e.currentTarget.classList.toggle('on');
    box.querySelector('#lumpSumFields').classList.toggle('hidden', m.itemized);
    box.querySelector('#itemizedFields').classList.toggle('hidden', !m.itemized);
    updateSummary();
  });

  box.querySelector('#simpleModeToggle').addEventListener('click', (e)=>{
    m.simpleMode = !m.simpleMode;
    e.currentTarget.classList.toggle('on');
    box.querySelector('#simpleFields').classList.toggle('hidden', !m.simpleMode);
    box.querySelector('#detailedFields').classList.toggle('hidden', m.simpleMode);
    updateSummary();
  });

  bindMoneyInput(box.querySelector('#manNetSalary'), ()=>m.simpleNetSalary, v=>{ m.simpleNetSalary=v; updateSummary(); });
  bindMoneyInput(box.querySelector('#otMonthlyInput'), ()=>state.otMonthlyAverage, v=>{
    state.otMonthlyAverage = v;
    updateSummary();
  });
  bindMoneyInput(box.querySelector('#otherIncomeInput'), ()=>state.otherIncomeMonthly, v=>{
    state.otherIncomeMonthly = v;
    updateSummary();
  });

  bindMoneyInput(box.querySelector('#manBasic'), ()=>m.basic, v=>{
    m.basic = v;
    const epfItem = m.deductionItems.find(i=>i.id==='d_epf');
    if(epfItem && epfItem.suggested){
      epfItem.amount = Math.round(v * 0.08);
      if(m.itemized) renderDeductionRows();
    }
    updateSummary();
  });
  bindMoneyInput(box.querySelector('#manAllow'), ()=>m.allowances, v=>{ m.allowances=v; updateSummary(); });
  bindMoneyInput(box.querySelector('#manDeduct'), ()=>m.deductions, v=>{ m.deductions=v; updateSummary(); });

  renderAllowanceRows();
  renderDeductionRows();
  updateSummary();
}

/* ---------- STEP 4 ---------- */
function renderStep4(){
  const cat = state.loanCategory;
  const wrap = el(`
    <section class="card p-6 sm:p-8">
      <h2 class="font-display text-xl font-bold" style="color:var(--teal-900)">${LOAN_LABELS[cat]} details</h2>
      <p class="text-sm mt-1" style="color:var(--text-600)">A few more details specific to this loan category.</p>
      <div id="catFields" class="mt-6 grid sm:grid-cols-2 gap-5 max-w-2xl"></div>
      <div id="catWarning" class="mt-5 max-w-2xl"></div>
      <div class="mt-6 max-w-2xl">
        <p class="field-label">Do you currently pay any monthly loan or credit card installments?</p>
        <div class="flex gap-2" id="hasObligationsToggle">
          <button type="button" data-answer="yes" class="obligations-answer-btn px-8 py-2.5 text-sm font-semibold">Yes</button>
          <button type="button" data-answer="no" class="obligations-answer-btn px-8 py-2.5 text-sm font-semibold">No</button>
        </div>
        <div id="obligationsAmountWrap" class="mt-4 hidden">
          <label class="field-label">Current Monthly Loan/Card Payments (LKR)</label>
          <input type="text" id="existingObl">
          <p class="hint">Included as a fixed monthly commitment when calculating your affordability — unless you plan to settle these with this new loan.</p>
          <div id="settleWrap" class="mt-3 hidden"></div>
        </div>
      </div>
      <div class="flex justify-between mt-8">
        <button id="backStep" class="btn-ghost px-5 py-2.5 rounded-xl text-sm">${t('back')}</button>
        <button id="toStep5" class="btn-primary px-6 py-2.5 rounded-xl text-sm">${t('seeEligibleBanks')} <i class="fa-solid fa-arrow-right ml-1.5 text-xs"></i></button>
      </div>
    </section>
  `);

  const fields = wrap.querySelector('#catFields');
  const warnBox = wrap.querySelector('#catWarning');

  function checkWarnings(){
    warnBox.innerHTML = '';
    if(cat==='vehicle' && vehicleAgeIneligible()){
      warnBox.appendChild(el(`
        <div class="flex items-start gap-3 p-3.5 rounded-xl" style="background:var(--danger-100)">
          <i class="fa-solid fa-triangle-exclamation mt-0.5" style="color:var(--danger)"></i>
          <p class="text-[13px]" style="color:var(--danger)"><span class="font-semibold">Vehicle age exceeds bank policy.</span> Most Sri Lankan banks do not offer leasing on vehicles manufactured more than 15 years ago.</p>
        </div>
      `));
    }
    const ageCap = getRetirementCapYears();
    if(ageCap <= 0){
      warnBox.appendChild(el(`
        <div class="flex items-start gap-3 p-3.5 rounded-xl mt-3" style="background:var(--amber-100)">
          <i class="fa-solid fa-hourglass-end mt-0.5" style="color:var(--amber-700)"></i>
          <p class="text-[13px]" style="color:var(--amber-700)"><span class="font-semibold">Retirement-age limit reached.</span> Standard tenure-based lending is not available. A consultant can advise on secured or shorter-term alternatives.</p>
        </div>
      `));
    } else if(ageCap < 5){
      warnBox.appendChild(el(`
        <div class="flex items-start gap-3 p-3.5 rounded-xl mt-3" style="background:var(--amber-100)">
          <i class="fa-solid fa-hourglass-half mt-0.5" style="color:var(--amber-700)"></i>
          <p class="text-[13px]" style="color:var(--amber-700)">Loan tenure will be capped at <span class="font-semibold">${ageCap} years</span> due to the retirement-age policy for this sector.</p>
        </div>
      `));
    }
  }

  if(cat === 'vehicle'){
    fields.innerHTML = `
      <div><label class="field-label">Vehicle Valuation (LKR)</label><input type="text" id="vValuation"></div>
      <div><label class="field-label">Manufacturing Year</label><input type="number" id="vYear" min="1980" max="${new Date().getFullYear()}" value="${state.vehicle.year}"><p id="vYearError" class="hint hidden" style="color:var(--danger)">Enter a valid year between 1980 and ${new Date().getFullYear()}.</p></div>
      <div><label class="field-label">Down payment: <span id="vDpLabel" class="font-mono">${state.vehicle.downPaymentPct}%</span></label><input type="range" id="vDp" min="10" max="50" step="5" value="${state.vehicle.downPaymentPct}" class="mt-3"></div>
      <div><label class="field-label">Target Loan Term Preference: <span id="vTermLabel" class="font-mono">${state.termYears||5} yrs</span></label><input type="range" id="vTerm" min="1" max="7" step="1" value="${state.termYears||5}" class="mt-3"><p class="hint">Each bank applies its own maximum leasing tenure — you can fine-tune this per bank on the comparison screen.</p></div>
      <div class="flex items-center justify-between p-3.5 rounded-xl" style="background:var(--teal-50)">
        <div><p class="text-[13.5px] font-semibold">Balloon Payment Option</p><p class="text-[12px]" style="color:var(--text-600)">Lower monthly EMI with a final lump-sum settlement.</p></div>
        <div id="balloonToggle" class="toggle ${state.vehicle.balloon?'on':''}"><div class="dot"></div></div>
      </div>
    `;
    bindMoneyInput(fields.querySelector('#vValuation'), ()=>state.vehicle.valuation, v=>{ state.vehicle.valuation=v; wrap.querySelector('#toStep5').disabled = v<=0; });
    fields.querySelector('#vYear').addEventListener('input', e=>{
      const raw = Number(e.target.value||0);
      const nowYear = new Date().getFullYear();
      const invalid = !raw || raw < 1980 || raw > nowYear;
      state.vehicle.year = raw;
      fields.querySelector('#vYearError').classList.toggle('hidden', !invalid);
      fields.querySelector('#vYear').classList.toggle('invalid', invalid);
      wrap.querySelector('#toStep5').disabled = invalid;
      checkWarnings();
    });
    fields.querySelector('#vDp').addEventListener('input', e=>{ state.vehicle.downPaymentPct = Number(e.target.value); fields.querySelector('#vDpLabel').textContent = state.vehicle.downPaymentPct+'%'; });
    fields.querySelector('#vTerm').addEventListener('input', e=>{ state.termYears = Number(e.target.value); fields.querySelector('#vTermLabel').textContent = state.termYears+' yrs'; });
    fields.querySelector('#balloonToggle').addEventListener('click', (e)=>{ state.vehicle.balloon = !state.vehicle.balloon; e.currentTarget.classList.toggle('on'); });
    checkWarnings();
  } else if(cat === 'housing'){
    fields.innerHTML = `
      <div><label class="field-label">Property Value (LKR)</label><input type="text" id="hValue"></div>
      <div><label class="field-label">Target Loan Term Preference: <span id="hTermLabel" class="font-mono">${state.housing.term} yrs</span></label><input type="range" id="hTerm" min="5" max="30" step="1" value="${state.housing.term}" class="mt-3"><p class="hint">Each bank applies its own maximum tenure (typically 20–25 yrs) — you can fine-tune this per bank on the comparison screen.</p></div>
      <div><label class="field-label">Down payment: <span id="hDpLabel" class="font-mono">${state.housing.downPaymentPct}%</span></label><input type="range" id="hDp" min="10" max="50" step="5" value="${state.housing.downPaymentPct}" class="mt-3"></div>
      <div class="stat-tile p-3.5"><p class="text-[11px] font-semibold" style="color:var(--text-400)">EST. LEGAL &amp; VALUATION FEE</p><p class="font-mono font-bold text-[15px] mt-1" style="color:var(--teal-800)">${fmt(getLegalFee())}</p></div>
    `;
    bindMoneyInput(fields.querySelector('#hValue'), ()=>state.housing.propertyValue, v=>{ state.housing.propertyValue=v; fields.querySelector('.stat-tile p.font-mono').textContent = fmt(getLegalFee()); wrap.querySelector('#toStep5').disabled = v<=0; });
    fields.querySelector('#hTerm').addEventListener('input', e=>{ state.housing.term = Number(e.target.value); state.termYears = state.housing.term; fields.querySelector('#hTermLabel').textContent = state.housing.term+' yrs'; checkWarnings(); });
    fields.querySelector('#hDp').addEventListener('input', e=>{ state.housing.downPaymentPct = Number(e.target.value); fields.querySelector('#hDpLabel').textContent = state.housing.downPaymentPct+'%'; });
    checkWarnings();
  } else if(cat === 'business'){
    fields.innerHTML = `<div class="sm:col-span-2"><label class="field-label">Target Loan Term Preference: <span id="bTermLabel" class="font-mono">${state.termYears||5} yrs</span></label><input type="range" id="bTerm" min="1" max="7" step="1" value="${state.termYears||5}" class="mt-3"><p class="hint">Each bank applies its own maximum tenure — you can fine-tune this per bank on the comparison screen.</p></div>`;
    fields.querySelector('#bTerm').addEventListener('input', e=>{ state.termYears = Number(e.target.value); fields.querySelector('#bTermLabel').textContent = state.termYears+' yrs'; });
    checkWarnings();
  } else {
    const sliderMax = cat === 'pension' ? 6 : (isEligibleProfession() ? 8 : 5);
    const sliderHint = cat === 'pension'
      ? "Each bank applies its own maximum tenure for pension-backed loans — you can fine-tune this per bank on the comparison screen."
      : (isEligibleProfession()
        ? "As an eligible profession, some banks' discounted Special Scheme allows a longer tenure than their standard product — you can fine-tune this per bank on the comparison screen."
        : "Each bank applies its own maximum tenure — you can fine-tune this per bank on the comparison screen.");
    fields.innerHTML = `<div class="sm:col-span-2"><label class="field-label">Target Loan Term Preference: <span id="pTermLabel" class="font-mono">${state.termYears||5} yrs</span></label><input type="range" id="pTerm" min="1" max="${sliderMax}" step="1" value="${state.termYears||5}" class="mt-3"><p class="hint">${sliderHint}</p></div>`;
    fields.querySelector('#pTerm').addEventListener('input', e=>{ state.termYears = Number(e.target.value); fields.querySelector('#pTermLabel').textContent = state.termYears+' yrs'; });
    checkWarnings();
  }

  const settleWrap = wrap.querySelector('#settleWrap');
  function renderSettleOption(){
    const hasObligations = Number(state.existingObligations||0) > 0;
    settleWrap.classList.toggle('hidden', !hasObligations);
    if(!hasObligations){
      settleWrap.innerHTML = '';
      delete settleWrap.dataset.built;
      state.settleExistingLoans = false;
      return;
    }
    if(!settleWrap.dataset.built){
      settleWrap.dataset.built = '1';
      settleWrap.innerHTML = `
        <div class="p-3.5 rounded-xl" style="background:var(--teal-50)">
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 text-[13px] font-semibold" style="color:var(--text-700)">
              <input type="checkbox" id="settleCheckbox" ${state.settleExistingLoans?'checked':''}>
              I will pay off these old loans using this new loan
              <span class="tooltip-trigger"><i class="fa-solid fa-circle-info text-[11px]" style="color:var(--text-400)"></i>
                <span class="tooltip-bubble">If checked, this monthly commitment is excluded from your affordability calculation — since it won't exist anymore once this loan settles it — freeing up more borrowing capacity.</span>
              </span>
            </label>
          </div>
          <div id="settleBalanceWrap" class="mt-3 max-w-xs ${state.settleExistingLoans?'':'hidden'}">
            <label class="field-label">Outstanding balance to settle (LKR)</label>
            <input type="text" id="settleBalance">
            <p class="hint">Used to estimate your net cash in hand after this loan settles your existing debt.</p>
          </div>
        </div>
      `;
      settleWrap.querySelector('#settleCheckbox').addEventListener('change', e=>{
        state.settleExistingLoans = e.target.checked;
        settleWrap.querySelector('#settleBalanceWrap').classList.toggle('hidden', !state.settleExistingLoans);
      });
      bindMoneyInput(settleWrap.querySelector('#settleBalance'), ()=>state.existingLoanBalance, v=>state.existingLoanBalance=v);
    }
  }
  renderSettleOption();

  bindMoneyInput(wrap.querySelector('#existingObl'), ()=>state.existingObligations, v=>{ state.existingObligations=v; renderSettleOption(); });

  const obligationsAmountWrap = wrap.querySelector('#obligationsAmountWrap');
  function paintObligationsAnswer(){
    wrap.querySelectorAll('.obligations-answer-btn').forEach(btn=>{
      btn.classList.toggle('selected', btn.dataset.answer === (state.hasExistingObligations===true?'yes':state.hasExistingObligations===false?'no':''));
    });
    obligationsAmountWrap.classList.toggle('hidden', state.hasExistingObligations !== true);
  }
  paintObligationsAnswer();
  wrap.querySelectorAll('.obligations-answer-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const answer = btn.dataset.answer === 'yes';
      state.hasExistingObligations = answer;
      if(!answer){
        state.existingObligations = 0;
        state.settleExistingLoans = false;
      }
      paintObligationsAnswer();
      renderSettleOption();
    });
  });

  wrap.querySelector('#backStep').addEventListener('click', ()=>{ state.step=3; render(); });
  wrap.querySelector('#toStep5').addEventListener('click', ()=>{ runEligibilityEngine(); state.step=5; render(); });
  return wrap;
}

/* ---------- STEP 5 ---------- */
function renderStep5(){
  runEligibilityEngine();
  if(isRestricted()) return renderStep5Guest();

  // Determine the true unrestricted ceiling (ignoring any custom requested-amount cap)
  // so the "Custom Requested Amount" control shows the full eligibility range, not an
  // already-capped view from a previous entry.
  const savedRequestedAmount = state.requestedAmount;
  state.requestedAmount = null;
  runEligibilityEngine();
  const trueMaxLoanAcrossBanks = Math.max(...state.results.filter(r=>!r.ineligible).map(r=>r.maxLoan), 0);
  state.requestedAmount = savedRequestedAmount;
  runEligibilityEngine();
  const sponsoredEligible = (()=>{
    const seen = new Set();
    const out = [];
    // state.results is already sorted by total cost of credit ascending, so the first
    // variant encountered per bank is automatically its cheaper/more attractive one —
    // showing both variants of the same sponsored bank here would look like duplicated
    // placement rather than genuine choice.
    state.results.filter(r=>!r.ineligible && r.bank.sponsored).forEach(r=>{
      if(seen.has(r.bank.id)) return;
      seen.add(r.bank.id);
      out.push(r);
    });
    return out;
  })();
  const eligibleResults = state.results.filter(r=>!r.ineligible);
  state.compareSelection = state.compareSelection.filter(key => eligibleResults.some(r=>r.variantKey===key));
  const lowestEmiResult = eligibleResults.length ? eligibleResults.reduce((a,b)=> a.emi <= b.emi ? a : b) : null;
  const highestLoanResult = eligibleResults.length ? eligibleResults.reduce((a,b)=> a.maxLoan >= b.maxLoan ? a : b) : null;
  const bankLabel = (r) => `${r.bank.name}${r.variantLabel ? ` (${r.variantLabel})` : ''}`;
  const wrap = el(`
    <section class="fade-in">
      ${(lowestEmiResult || highestLoanResult) ? `
      <div class="card p-3 sm:p-3.5 mb-3" style="background:var(--teal-50); border-color:var(--teal-100)">
        <p class="text-[11px] font-bold tracking-wide mb-2" style="color:var(--teal-700)">QUICK SUMMARY</p>
        <div class="grid sm:grid-cols-2 gap-2">
          ${lowestEmiResult ? `
          <div class="flex items-start gap-2">
            <span class="text-[15px]">🏆</span>
            <p class="text-[12.5px]" style="color:var(--teal-900)"><span class="font-semibold">Lowest EMI:</span> ${bankLabel(lowestEmiResult)} <span class="font-mono font-semibold">(${fmt(lowestEmiResult.emi)}/mo)</span></p>
          </div>` : ''}
          ${highestLoanResult ? `
          <div class="flex items-start gap-2">
            <span class="text-[15px]">💰</span>
            <p class="text-[12.5px]" style="color:var(--teal-900)"><span class="font-semibold">Highest Loan Amount:</span> ${bankLabel(highestLoanResult)} <span class="font-mono font-semibold">(${fmt(highestLoanResult.maxLoan)})</span></p>
          </div>` : ''}
        </div>
      </div>` : ''}
      <div class="card p-3 sm:p-4">
        <div class="flex flex-wrap items-center justify-between gap-3">
          <div>
            <h2 class="font-display text-xl font-bold" style="color:var(--teal-900)">${t('step5Title')}</h2>
            <p class="text-sm mt-0.5" style="color:var(--text-600)">${LOAN_LABELS[state.loanCategory]} · ${(state.sector||'').replace('_',' ')} sector ${state.results.find(r=>r.schemeApplied)?'· <span class="font-semibold" style="color:var(--violet-700)">Professional scheme rate applied</span>':''} ${state.applicant.jointApplicant?'· Joint applicant income combined':''}</p>
          </div>
          <button id="backStep4" class="btn-ghost px-4 py-2 rounded-xl text-sm">${t('back')}</button>
        </div>

        <div class="grid sm:grid-cols-2 gap-3 mt-3">
          <div class="p-2.5 sm:p-3 rounded-xl" style="background:var(--teal-50)">
            <div class="flex items-center justify-between flex-wrap gap-1">
              <label class="field-label !mb-0">Target Loan Amount</label>
              ${state.requestedAmount ? `<button id="clearRequestedAmount" type="button" class="text-[11px] font-semibold" style="color:var(--teal-700)">Use full eligibility</button>` : ''}
            </div>
            <p class="font-mono font-bold text-[18px] mt-0.5" style="color:var(--teal-800)" id="amountSliderValue">${fmt(state.requestedAmount || trueMaxLoanAcrossBanks)}</p>
            <input type="range" id="amountSlider" min="100000" max="${Math.max(trueMaxLoanAcrossBanks, 100000)}" step="${state.admin.loanRoundingStep>0?state.admin.loanRoundingStep:50000}" value="${state.requestedAmount || trueMaxLoanAcrossBanks}" class="mt-1.5">
          </div>
          <div class="p-2.5 sm:p-3 rounded-xl" style="background:var(--teal-50)">

        const name = cbWrap.querySelector('#gSoftName').value.trim();
        const phone = cbWrap.querySelector('#gSoftPhone').value.trim();
        const valid = /^0\d{9}$/.test(phone.replace(/\s/g,''));
        cbWrap.querySelector('#gSoftError').classList.toggle('hidden', valid);
        cbWrap.querySelector('#gSoftPhone').classList.toggle('invalid', !valid);
        if(!valid || !name) return;
        state.softLeads.push({ id:Date.now(), name, phone, category:LOAN_LABELS[state.loanCategory], date:new Date().toLocaleDateString('en-LK') });
        cbWrap.querySelector('#gSoftSuccess').classList.remove('hidden');
      });
    }
  });

  return wrap;
}

  // data aggregated into 12-month groups, so the two views can never drift apart.
  const monthlyData = [];
  let runningBalance = r.maxLoan;
  for(let m=1; m<=totalMonths; m++){
    const interestPortion = runningBalance * rMonthly;

      <td class="py-2 pl-3 pr-4 font-mono font-semibold text-right whitespace-nowrap">${fmt(mo.balance)}</td>

  }
  function yearlyRowsHtml(){

      <td class="py-2 pl-3 pr-4 font-mono font-semibold text-right whitespace-nowrap">${fmt(yr.balance)}</td>
    </tr>`).join('');
  }
  function monthlyPrintRowsHtml(){
    return monthlyData.map(mo => `<tr>
      <td style="text-align:center; padding:6px 10px; border:1px solid #ccc;">${mo.month}</td>
      <td style="text-align:right; padding:6px 10px; border:1px solid #ccc;">${fmt(r.emi)}</td>

      <td style="text-align:right; padding:6px 10px; border:1px solid #ccc; font-weight:bold;">${fmt(mo.balance)}</td>
    </tr>`).join('');
  }
  function yearlyPrintRowsHtml(){
    return yearlyData.map(yr => `<tr>
      <td style="text-align:center; padding:6px 10px; border:1px solid #ccc;">${yr.year}</td>
      <td style="text-align:right; padding:6px 10px; border:1px solid #ccc;">${fmt(r.emi)}</td>
      <td style="text-align:right; padding:6px 10px; border:1px solid #ccc;">${fmt(yr.interest)}</td>
      <td style="text-align:right; padding:6px 10px; border:1px solid #ccc;">${fmt(yr.principal)}</td>

    <div class="rounded-xl p-3.5 mb-4" style="background:var(--teal-50)">
      <ul class="space-y-1">
        ${milestoneLines.map(line=>`<li class="text-[12.5px] flex items-start gap-2" style="color:var(--teal-800)"><i class="fa-solid fa-circle-check mt-0.5 text-[10px]" style="color:var(--teal-700)"></i><span>${line}</span></li>`).join('')}
      </ul>
    </div>

    <div class="inline-flex p-1 rounded-xl gap-1 mb-3" style="background:var(--teal-50)" id="scheduleViewTabs">
      <button data-view="monthly" class="schedule-view-tab px-3.5 py-1.5 rounded-lg text-[12.5px] font-semibold">Monthly View <span class="font-normal">(All Months)</span></button>
      <button data-view="annual" class="schedule-view-tab px-3.5 py-1.5 rounded-lg text-[12.5px] font-semibold">Annual Summary</button>
    </div>

    <p id="scheduleViewNote" class="text-[12.5px] mb-3" style="color:var(--text-600)"></p>
    <div id="scheduleTableWrap" class="overflow-x-auto rounded-xl border" style="border-color:var(--line)">
      <div id="scheduleTableScroll" class="overflow-y-auto" style="max-height:420px">
        <table class="w-full text-[12.5px] min-w-[480px]">
          <thead><tr class="border-b" style="border-color:var(--line); background:var(--teal-50)">
            <th id="scheduleColHeader" class="py-2 px-3 font-semibold text-center sticky top-0" style="color:var(--text-600); background:var(--teal-50)">Month</th>
            <th class="py-2 px-3 font-semibold text-right sticky top-0" style="color:var(--text-600); background:var(--teal-50)">Monthly Payment</th>
            <th class="py-2 px-3 font-semibold text-right sticky top-0" style="color:var(--text-600); background:var(--teal-50)">Interest Paid</th>
            <th class="py-2 px-3 font-semibold text-right sticky top-0" style="color:var(--text-600); background:var(--teal-50)">Principal Paid</th>
            <th class="py-2 pl-3 pr-4 font-semibold text-right sticky top-0" style="color:var(--text-600); background:var(--teal-50)">Remaining Balance</th>
          </tr></thead>
          <tbody id="scheduleTableBody"></tbody>
        </table>
      </div>
    </div>
  `;

  function renderScheduleView(){
    panel.querySelectorAll('.schedule-view-tab').forEach(btn=>{
      const active = btn.dataset.view === scheduleView;
      btn.style.background = active ? '#fff' : 'transparent';
      btn.style.color = active ? 'var(--teal-800)' : 'var(--text-600)';
      btn.style.boxShadow = active ? '0 1px 4px rgba(0,53,47,0.12)' : 'none';
    });
    const isMonthly = scheduleView === 'monthly';
    panel.querySelector('#scheduleColHeader').textContent = isMonthly ? 'Month' : 'Year';
    panel.querySelector('#scheduleTableBody').innerHTML = isMonthly ? monthlyRowsHtml() : yearlyRowsHtml();
    panel.querySelector('#scheduleViewNote').textContent = isMonthly
      ? `Full month-by-month breakdown — Month 1 to Month ${totalMonths} — at the current rate of ${r.rate.toFixed(2)}% p.a. Actual figures will vary with any rate changes over the loan term.`
      : `Year-by-year summary (Year 1 to Year ${years}) at the current rate of ${r.rate.toFixed(2)}% p.a. Switch to Monthly View for the exact figure in any given month.`;
    // A 300+ row monthly table doesn't need a tall scroll area for a short loan —
    // only cap the height once there's actually enough content to warrant scrolling.
    panel.querySelector('#scheduleTableScroll').style.maxHeight = (isMonthly && totalMonths > 14) ? '420px' : 'none';
  }
  panel.querySelectorAll('.schedule-view-tab').forEach(btn=>{
    btn.addEventListener('click', ()=>{ scheduleView = btn.dataset.view; renderScheduleView(); });
  });
  renderScheduleView();

  schedule.querySelector('#printScheduleBtn').addEventListener('click', ()=>{
    if(scheduleView === 'monthly'){
      printAmortizationSchedule(r, milestoneLines, monthlyPrintRowsHtml(), totalMonths, 'Month');
    } else {
      printAmortizationSchedule(r, milestoneLines, yearlyPrintRowsHtml(), years, 'Year');
    }
  });

  function paintModalTabs(active){

    panel.querySelectorAll('.modal-tab').forEach(btn=>{
      const isActive = btn.dataset.tab === active;
      btn.style.background = isActive ? '#fff' : 'transparent';
      btn.style.color = isActive ? 'var(--teal-800)' : 'var(--text-600)';
      btn.style.boxShadow = isActive ? '0 1px 4px rgba(0,53,47,0.12)' : 'none';
    });
    panel.querySelector('#modalOverview').classList.toggle('hidden', active!=='overview');
    panel.querySelector('#modalSchedule').classList.toggle('hidden', active!=='schedule');
  }
  paintModalTabs('overview');
  panel.querySelectorAll('.modal-tab').forEach(btn=>{ btn.addEventListener('click', ()=>paintModalTabs(btn.dataset.tab)); });

  const milestoneInput = panel.querySelector('#milestoneMonths');
  function updateBalance(){
    const k = clamp(Number(milestoneInput.value||0), 0, r.months);
    const bal = balanceAfterPayments(r.maxLoan, r.rate, r.months, k);
    panel.querySelector('#balanceOut').textContent = fmt(bal) + (k>=r.months ? ' (fully repaid)' : '');
  }
  milestoneInput.addEventListener('input', updateBalance);
  panel.querySelectorAll('.milestone-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ milestoneInput.value = Math.min(Number(btn.dataset.yrs)*12, r.months); updateBalance(); });
  });
  updateBalance();
}

function renderAdminPanel(){
  const wrap = el(`<div class="admin-shell pt-6 pb-10"></div>`);
  wrap.appendChild(el(`
    <div class="flex flex-wrap items-start justify-between gap-3 mb-5">
      <div>
        <h2 class="font-display text-xl font-bold" style="color:var(--adm-text)">Admin Console <span class="admin-badge admin-badge-active align-middle ml-1">Simulation</span></h2>
        <p class="text-sm mt-1" style="color:var(--adm-text-dim)">Clean, organized controls — grouped into focused sections.</p>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <button id="exportJsonBtn" class="admin-btn-ghost px-4 py-2 rounded-xl text-[13px]"><i class="fa-solid fa-download mr-1.5"></i>Export JSON</button>
        <button id="importJsonBtn" class="admin-btn-ghost px-4 py-2 rounded-xl text-[13px]"><i class="fa-solid fa-upload mr-1.5"></i>Import JSON</button>
        <input type="file" id="importJsonInput" accept="application/json,.json" class="hidden">
        <button id="resetAdminBtn" class="admin-btn-ghost px-4 py-2 rounded-xl text-[13px]"><i class="fa-solid fa-rotate-left mr-1.5"></i>Reset to defaults</button>
      </div>
    </div>
  `));
  wrap.querySelector('#resetAdminBtn').addEventListener('click', ()=>{
    if(!confirm('Reset all bank and product data to factory defaults? This clears your saved changes and reloads the page.')) return;
    try{ localStorage.removeItem(BANKS_STORAGE_KEY); }catch(e){ console.warn('Could not clear saved bank data:', e); }
    location.reload();
  });

  wrap.querySelector('#exportJsonBtn').addEventListener('click', ()=>{
    const payload = { banks: state.admin.banks, exportedAt: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'waby_loan_data.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  });

  const importInput = wrap.querySelector('#importJsonInput');
  wrap.querySelector('#importJsonBtn').addEventListener('click', ()=>importInput.click());
  importInput.addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        // Accept either the export format ({ banks: [...] }) or a bare banks array,
        // so a hand-edited or older-format file still imports cleanly.
        const banks = Array.isArray(parsed) ? parsed : parsed.banks;
        if(!Array.isArray(banks) || banks.length === 0){
          alert('This file doesn\'t contain valid bank data.');
          return;
        }
        state.admin.banks = banks;
        persistBanksToStorage();
        render();
      }catch(err){
        alert('Could not read this file — make sure it\'s a valid Waby Loan JSON export.');
      }
    };
    reader.readAsText(file);
    importInput.value = ''; // allow re-importing the same filename later
  });

  const NAV = [
    { id:'dashboard', icon:'fa-gauge-high', label:'Dashboard' },
    { id:'banks', icon:'fa-building-columns', label:'Banks' },
    { id:'loanproducts', icon:'fa-tags', label:'Loan Products' },
    { id:'companylists', icon:'fa-list-check', label:'Company Lists' },
    { id:'professions', icon:'fa-graduation-cap', label:'Occupations' },
    { id:'settings', icon:'fa-gear', label:'Settings' },
    { id:'leads', icon:'fa-phone', label:'Leads' },
    { id:'users', icon:'fa-users', label:'Users' },
    { id:'auditlog', icon:'fa-clock-rotate-left', label:'Audit Log' },
  ];
  if(!state.adminTab || state.adminTab === 'undefined') state.adminTab = 'dashboard';

  const shellRow = el(`<div class="flex flex-col md:flex-row gap-5"></div>`);
  const sidebar = el(`<aside class="md:w-56 flex-shrink-0"><nav class="flex md:flex-col gap-1 overflow-x-auto md:overflow-visible pb-2 md:pb-0"></nav></aside>`);
  const navEl = sidebar.querySelector('nav');
  NAV.forEach(nb=>{
    const link = el(`<button type="button" class="admin-nav-link ${state.adminTab===nb.id?'active':''} flex-shrink-0"><i class="fa-solid ${nb.icon} w-4 text-center"></i><span>${nb.label}</span></button>`);
    link.addEventListener('click', ()=>{ state.adminTab = nb.id; render(); });
    navEl.appendChild(link);
  });
  navEl.appendChild(el(`<div class="hidden md:block h-px my-2" style="background:var(--adm-border)"></div>`));
  const backLink = el(`<button type="button" class="admin-nav-link flex-shrink-0"><i class="fa-solid fa-arrow-left w-4 text-center"></i><span>Back to site</span></button>`);
  backLink.addEventListener('click', ()=>{ state.view = 'user'; render(); });
  navEl.appendChild(backLink);
  shellRow.appendChild(sidebar);

  const content = el(`<div class="min-w-0 flex-1"></div>`);
  if(state.adminTab === 'dashboard') content.appendChild(renderAdminDashboardTab());
  else if(state.adminTab === 'banks') content.appendChild(renderAdminBanksTab());
  else if(state.adminTab === 'loanproducts') content.appendChild(renderAdminLoanProductsTab());
  else if(state.adminTab === 'companylists') content.appendChild(renderAdminCompanyListsTab());
  else if(state.adminTab === 'settings') content.appendChild(renderAdminSettingsTab());
  else if(state.adminTab === 'professions') content.appendChild(renderAdminProfessionsTab());
  else if(state.adminTab === 'leads') content.appendChild(renderAdminLeadsTab());
  else if(state.adminTab === 'users') content.appendChild(renderAdminUsersTab());
  else if(state.adminTab === 'auditlog') content.appendChild(renderAdminAuditLogTab());
  shellRow.appendChild(content);
  wrap.appendChild(shellRow);

  return wrap;
}

/* ---------- Loan Products (flat cross-bank view) ---------- */
function renderAdminLoanProductsTab(){
  const wrap = el(`<div class="admin-card p-5 sm:p-6"></div>`);
  wrap.appendChild(el(`
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <div>
        <p class="font-display font-semibold text-[16px]" style="color:var(--adm-text)">All Loan Products</p>
        <p class="text-[12.5px] mt-0.5" style="color:var(--adm-text-dim)">Every specialty product across every bank, with all 44 fields — the single place to add, edit, or remove them.</p>
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[12px]" style="color:var(--adm-text-dim)"></i>
          <input type="text" id="lpSearchInput" class="admin-input !w-56 !pl-9" placeholder="Search product or bank name...">
        </div>
        <select id="lpBankFilter" class="admin-select !w-auto">
          <option value="all">All banks</option>
          ${state.admin.banks.map(b=>`<option value="${b.id}">${b.name}</option>`).join('')}
        </select>
        <button id="lpAddBtn" type="button" class="admin-btn-primary px-4 py-2 rounded-xl text-[13px] flex-shrink-0"><i class="fa-solid fa-plus mr-1.5"></i>Add Product</button>
      </div>
    </div>
  `));
  const tableWrap = el(`<div class="overflow-x-auto"></div>`);
  wrap.appendChild(tableWrap);
  let currentFilter = 'all';
  let currentSearch = '';

  function buildRows(){
    const rows = [];
    const q = currentSearch.trim().toLowerCase();
    state.admin.banks.forEach(b=>{
      (b.products||[]).filter(p=>p.id!=='general').forEach(p=>{
        if(currentFilter !== 'all' && b.id !== currentFilter) return;
        if(q && !p.name.toLowerCase().includes(q) && !b.name.toLowerCase().includes(q)) return;
        rows.push({ bank:b, product:p });
      });
    });
    const STATUS_CLASS = { active:'admin-badge-active', suspended:'admin-badge-inactive', promotional:'admin-badge-sponsored' };
    tableWrap.innerHTML = '';
    if(rows.length === 0){
      tableWrap.appendChild(el(`<p class="text-[13px] py-6 text-center" style="color:var(--adm-text-dim)">No matching products.</p>`));
      return;
    }
    const table = el(`
      <table class="w-full admin-table">
        <thead><tr>
          <th>Bank</th><th>Product</th><th>Category</th><th>Rate</th><th>Status</th><th></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    `);
    const tbody = table.querySelector('tbody');
    rows.forEach(({bank,product})=>{
      const row = el(`
        <tr>
          <td>${bank.name}</td>
          <td class="font-semibold" style="color:var(--adm-text)">${product.name}</td>
          <td>${LOAN_LABELS[product.category]||product.category}</td>
          <td class="font-mono">${product.rate!=null?Number(product.rate).toFixed(2)+'%':'—'}</td>
          <td><span class="admin-badge ${STATUS_CLASS[product.status]||'admin-badge-active'}">${(product.status||'active').charAt(0).toUpperCase()+(product.status||'active').slice(1)}</span></td>
          <td class="whitespace-nowrap">
            <button type="button" class="lp-edit-btn admin-btn-ghost px-3 py-1.5 rounded-lg text-[12px]">Edit</button>
            <button type="button" class="lp-delete-btn w-7 h-7 rounded-full inline-flex items-center justify-center" style="color:var(--adm-danger)"><i class="fa-solid fa-trash text-[11px]"></i></button>
          </td>
        </tr>
      `);
      row.querySelector('.lp-edit-btn').addEventListener('click', ()=>{ openProductDrawer(bank, product); });
      row.querySelector('.lp-delete-btn').addEventListener('click', ()=>{
        if(!confirm(`Delete "${product.name}" from ${bank.name}? This can't be undone.`)) return;
        bank.products = (bank.products||[]).filter(x=>x.id!==product.id);
        logAudit('Deleted loan product', `${bank.name} — ${product.name}`);
        persistBanksToStorage();
        render();
      });
      tbody.appendChild(row);
    });
    tableWrap.appendChild(table);
  }
  buildRows();
  wrap.querySelector('#lpBankFilter').addEventListener('change', e=>{ currentFilter = e.target.value; buildRows(); });
  wrap.querySelector('#lpSearchInput').addEventListener('input', e=>{ currentSearch = e.target.value; buildRows(); });
  wrap.querySelector('#lpAddBtn').addEventListener('click', ()=>{
    // The bank filter now doubles as the target bank for new products — "All banks"
    // isn't a valid target, so ask the admin to narrow it down first rather than
    // guessing which bank they meant.
    if(currentFilter === 'all'){
      alert('Select a specific bank from the dropdown first, then Add Product.');
      return;
    }
    const bank = state.admin.banks.find(b=>b.id===currentFilter);
    if(bank) openProductDrawer(bank, null);
  });
  return wrap;
}
